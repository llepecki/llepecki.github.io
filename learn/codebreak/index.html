          }
          if (state.puzzle) {
            return getSymbolPool(state.puzzle.variant, state.puzzle.level);
          }
          return getSymbolPool(state.variant, state.level);
        }

        function currentPoolIds() {
          return currentPoolSymbols().map(function (s) {
            return s.id;
          });
        }

        const factsCache = { key: null, facts: null };
        function deriveFacts() {
          const puzzle = state.puzzle;
          if (!puzzle) return null;
          const key =
            puzzle.variant +
            "|" +
            puzzle.level +
            "|" +
            puzzle.seed +
            "|" +
            puzzle.clues.length +
            "|" +
            puzzle.code.join(",");
          if (factsCache.key === key) return factsCache.facts;
          const poolIds = currentPoolIds();
          const candidates = filterCandidates(
            enumerateCodes(poolIds),
            puzzle.clues,
          );
          const absent = {};
          poolIds.forEach(function (id) {
            absent[id] = true;
          });
          const confirmed = [null, null, null];
          const impossibleAt = [{}, {}, {}];
          for (let slot = 0; slot < 3; slot++) {
            poolIds.forEach(function (id) {
              impossibleAt[slot][id] = true;
            });
          }
          candidates.forEach(function (code) {
            code.forEach(function (id, slot) {
              absent[id] = false;
              impossibleAt[slot][id] = false;
            });
          });
          for (let slot = 0; slot < 3; slot++) {
            const first = candidates.length ? candidates[0][slot] : null;
            let agree = first !== null;
            for (let i = 1; i < candidates.length; i++) {
              if (candidates[i][slot] !== first) {
                agree = false;
                break;
              }
            }
            confirmed[slot] = agree ? first : null;
          }
          const facts = {
            candidates: candidates,
            absent: absent,
            confirmed: confirmed,
            impossibleAt: impossibleAt,
          };
          factsCache.key = key;
          factsCache.facts = facts;
          return facts;
        }

        // Codes the child's own notes still allow. This is the shrinking
        // count shown by the candidate readout and the stage-4 hint —
        // clue-based certainty stays in deriveFacts, where a solvable case
        // always narrows to exactly one code.
        function markCandidates() {
          const marks = state.marks;
          return enumerateCodes(currentPoolIds()).filter(function (code) {
            for (let slot = 0; slot < 3; slot++) {
              const id = code[slot];
              if (marks.absent[id] === "no") return false;
              if (marks.cells[slot][id] === "no") return false;
            }
            const absentOk = Object.keys(marks.absent).every(function (id) {
              return marks.absent[id] !== "yes" || code.indexOf(id) >= 0;
            });
            if (!absentOk) return false;
            return marks.cells.every(function (cell, slot) {
              return Object.keys(cell).every(function (id) {
                return cell[id] !== "yes" || code[slot] === id;
              });
            });
          });
        }

        function resetBoard() {
          state.answer = [null, null, null];
          state.undoStack = [];
          state.activeSlot = 0;
          state.solved = false;
          state.attempts = 0;
          state.hintsUsed = 0;
          state.hintFlags = { candShown: false, revealWait: 0 };
          state.marks = { absent: {}, cells: [{}, {}, {}] };
          state.lastMark = null;
          state.feedback = null;
          state.selectedClue = null;
          state.violatedClue = null;
          state.step = null;
        }

        // Clue-local deductions a child could make from one card alone:
        // "nothing" eliminates its symbols, any zero-well-placed card rules
        // each symbol out of its shown slot, and "three wrong" pins the code
        // to the guessed trio, ruling every other symbol out.
        function applyAutoMarks() {
          const puzzle = state.puzzle;
          if (!puzzle) return;
          const poolIds = currentPoolIds();
          puzzle.clues.forEach(function (clue) {
            if (clue.phraseKey === "clueNothing") {
              clue.guess.forEach(function (id) {
                state.marks.absent[id] = "no";
              });
            }
            if (clue.score.wellPlaced === 0) {
              clue.guess.forEach(function (id, slot) {
                state.marks.cells[slot][id] = "no";
              });
            }
            if (clue.phraseKey === "clueThreeWrong") {
              poolIds.forEach(function (id) {
                if (clue.guess.indexOf(id) < 0) state.marks.absent[id] = "no";
                else state.marks.absent[id] = "yes";
              });
            }
          });
        }

        /* ================= MODES ================= */
        // The first Step By Step puzzle is the authored teaching case; every
        // later one is generated. `guided` routes the authored per-clue
        // lesson copy and keeps the solve out of the progress counters.
        function buildGuidedPuzzle() {
          return {
            level: 1,
            variant: "numbers",
            seed: -1,
            code: LEARN_CASE.code.slice(),
            clues: LEARN_CASE.guesses.map(function (guess) {
              return makeClue(LEARN_CASE.code, guess);
            }),
            guided: true,
          };
        }

        // Direct marks a child can make from one clue card alone. Returns
        // null when the clue teaches nothing certain by itself (one symbol is
        // well placed, but which one is not yet knowable).
        function computeRequiredMarks(clue) {
          if (clue.phraseKey === "clueNothing") {
            return { kind: "absent", ids: clue.guess.slice() };
          }
          if (clue.score.wellPlaced === 0 && clue.score.present > 0) {
            return {
              kind: "cells",
              pairs: clue.guess.map(function (id, slot) {
                return { slot: slot, id: id };
              }),
            };
          }
          return null;
        }

        // A whole-symbol absent mark is strictly stronger than any per-slot
        // elimination, so it covers the cell requirement — never force a
        // child to re-mark a symbol they already crossed out entirely.
        function cellCovered(slot, id) {
          return (
            state.marks.cells[slot][id] === "no" ||
            state.marks.absent[id] === "no"
          );
        }

        function marksSatisfied(req) {
          if (!req) return true;
          if (req.kind === "absent") {
            return req.ids.every(function (id) {
              return state.marks.absent[id] === "no";
            });
          }
          return req.pairs.every(function (pair) {
            return cellCovered(pair.slot, pair.id);
          });
        }

        function stepMarksSatisfied() {
          return marksSatisfied(state.step && state.step.requiredMarks);
        }

        function clueMarksApplied(index) {
          const clue = state.puzzle && state.puzzle.clues[index];
          if (!clue) return false;
          const req = computeRequiredMarks(clue);
          return req ? marksSatisfied(req) : false;
        }

        function startStep() {
          state.step = {
            revealed: 1,
            requiredMarks: computeRequiredMarks(state.puzzle.clues[0]),
            satisfied: false,
          };
          state.step.satisfied = stepMarksSatisfied();
        }

        function revealNextClue() {
          const step = state.step;
          if (!step || step.revealed >= state.puzzle.clues.length) return;
          step.revealed++;
          step.requiredMarks = computeRequiredMarks(
            state.puzzle.clues[step.revealed - 1],
          );
          step.satisfied = stepMarksSatisfied();
          state.selectedClue = null;
          state.feedback = null;
          render();
        }

        function evaluateStepProgress() {
          if (state.mode !== "step" || !state.step || state.step.satisfied) {
            return;
          }
          if (stepMarksSatisfied()) {
            state.step.satisfied = true;
            if (state.step.revealed < state.puzzle.clues.length) {
              setFeedback("perfect", T("stepDone"));
            }
          }
        }

        function applyClueMarks(index) {
          const clue = state.puzzle && state.puzzle.clues[index];
          if (!clue || boardLocked()) return;
          const req = computeRequiredMarks(clue);
          if (!req) return;
          if (req.kind === "absent") {
            req.ids.forEach(function (id) {
              state.marks.absent[id] = "no";
            });
            state.lastMark = { kind: "absent", ids: req.ids.slice() };
          } else {
            const pending = req.pairs.filter(function (pair) {
              return !cellCovered(pair.slot, pair.id);
            });
            pending.forEach(function (pair) {
              state.marks.cells[pair.slot][pair.id] = "no";
            });
            if (pending.length) {
              state.lastMark = {
                kind: "cell",
                slot: pending[0].slot,
                id: pending[0].id,
              };
            }
          }
          announce(T("clueMarked"));
          evaluateStepProgress();
          render();
        }

        function newCase() {
          // The guided case is authored in numbers at level 1; honor any
          // deliberate variant/level choice with a generated step puzzle
          // instead of pinning the board to the tutorial.
          const wantGuided =
            state.mode === "step" &&
            !state.progress.guidedDone &&
            state.variant === "numbers" &&
            state.level === 1;
          state.puzzle = wantGuided
            ? buildGuidedPuzzle()
            : generatePuzzle(state.level, state.variant, nextSeed());
          resetBoard();
          if (state.mode === "step") startStep();
          else if (LEVELS[state.puzzle.level].marks === "auto") {
            applyAutoMarks();
          }
          render();
        }

        function setMode(mode) {
          state.mode = mode;
          state.feedback = null;
          state.started = true;
          newCase();
          saveProgress();
        }

        /* ---- answer manipulation ---- */
        function answerComplete() {
          return state.answer.every(function (v) {
            return v !== null;
          });
        }

        function boardLocked() {
          return state.solved;
        }

        function fillSlot(id) {
          if (boardLocked()) return;
          if (state.answer.indexOf(id) >= 0) return;
          state.undoStack.push(state.answer.slice());
          state.answer[state.activeSlot] = id;
          for (let i = 1; i <= 3; i++) {
            const idx = (state.activeSlot + i) % 3;
            if (state.answer[idx] === null) {
              state.activeSlot = idx;
              break;
            }
          }
          render();
        }

        function clearActiveSlot() {
          if (boardLocked()) return;
          let idx = state.activeSlot;
          if (state.answer[idx] === null && idx > 0) idx--;
          if (state.answer[idx] !== null) {
            state.undoStack.push(state.answer.slice());
            state.answer[idx] = null;
          }
          state.activeSlot = idx;
          render();
        }

        function undoAnswer() {
          if (boardLocked()) return;
          const prev = state.undoStack.pop();
          if (prev) {
            state.answer = prev;
            render();
          }
        }

        function clearAnswer() {
          if (boardLocked()) return;
          if (
            state.answer.every(function (v) {
              return v === null;
            })
          ) {
            return;
          }
          state.undoStack.push(state.answer.slice());
          state.answer = [null, null, null];
          state.activeSlot = 0;
          render();
        }

        function nextAction() {
          if (state.mode === "step" && state.puzzle && !state.solved) {
            // Only the guided tutorial locks Next behind its marks — its
            // lesson copy builds on them. Generated puzzles leave the
            // choice to the child; the ready styling is the nudge.
            if (state.puzzle.guided && (!state.step || !state.step.satisfied)) {
              return;
            }
            revealNextClue();
            return;
          }
          newCase();
        }

        /* ================= HINTS & FEEDBACK ================= */
        function labelFor(id) {
          return symbolById(currentVariantForBoard(), id).label;
        }

        function labelList(ids) {
          return ids.map(labelFor).join(", ");
        }

        function setFeedback(type, text) {
          state.feedback = { type: type, text: text };
          announce(text);
        }

        function findViolatedClue(answer) {
          const clues = state.puzzle.clues;
          for (let i = 0; i < clues.length; i++) {
            const got = scoreGuess(answer, clues[i].guess);
            if (!sameScore(got, clues[i].score)) {
              return { index: i, got: got, want: clues[i].score };
            }
          }
          return null;
        }

        function checkAnswer() {
          if (!state.puzzle || state.solved) return;
          if (!answerComplete()) {
            setFeedback("miss", T("fbIncomplete"));
            render();
            return;
          }
          state.attempts++;
          const answer = state.answer.slice();
          if (codesEqual(answer, state.puzzle.code)) {
            handleSolved();
          } else {
            handleWrong(answer);
          }
          render();
        }

        function handleSolved() {
          state.solved = true;
          state.violatedClue = null;
          markIntroSeen();
          const noHints = state.hintsUsed === 0;
          const level = state.puzzle.level;
          if (state.puzzle.guided) {
            state.progress.guidedDone = true;
          } else {
            state.progress.solvedByLevel[level] =
              (state.progress.solvedByLevel[level] || 0) + 1;
            if (noHints) {
              state.progress.perfectByLevel[level] =
                (state.progress.perfectByLevel[level] || 0) + 1;
            }
          }
          saveProgress();
          const message = noHints ? T("fbPerfect") : T("fbPerfectHints");
          setFeedback("perfect", message);
          showOverlay(
            "perfect",
            noHints ? "🎯" : "🎉",
            T("ovSolved"),
            noHints ? T("ovMatches") : T("ovSolvedHints"),
          );
        }

        function handleWrong(answer) {
          state.violatedClue = null;
          const rel = scoreGuess(state.puzzle.code, answer);
          if (rel.present === 0) {
            setFeedback("miss", T("fbMiss"));
            return;
          }
          if (rel.present === 3) {
            setFeedback("close", T("fbClose", { count: 3 - rel.wellPlaced }));
            return;
          }
          const violated = findViolatedClue(answer);
          if (!violated) {
            setFeedback("far", T("fbWrongGeneric"));
            return;
          }
          state.violatedClue = violated.index;
          const clueNo = violated.index + 1;
          if (violated.got.present !== violated.want.present) {
            setFeedback(
              "far",
              T("fbFarPresent", {
                got: violated.got.present,
                want: violated.want.present,
                clue: clueNo,
              }),
            );
          } else {
            setFeedback(
              "far",
              T("fbFarWell", {
                got: violated.got.wellPlaced,
                want: violated.want.wellPlaced,
                clue: clueNo,
              }),
            );
          }
        }

        // Hints are staged and always teach by APPLYING a mark:
        // 1 absent symbols from a nothing/three-wrong clue, 2 one impossible
        // slot, 3 one confirmed slot, 4 candidate count, 5 reveal (only after
        // repeated struggle). Each press takes the first stage that still has
        // something new to say about THIS case.
        function requestHint() {
          if (!state.puzzle || state.solved) return;
          if (state.mode === "step") return;
          const facts = deriveFacts();
          const clues = state.puzzle.clues;
          const poolIds = currentPoolIds();
          state.hintsUsed++;
          for (let i = 0; i < clues.length; i++) {
            const clue = clues[i];
            if (clue.phraseKey === "clueNothing") {
              const unmarked = clue.guess.filter(function (id) {
                return state.marks.absent[id] !== "no";
              });
              if (unmarked.length) {
                clue.guess.forEach(function (id) {
                  state.marks.absent[id] = "no";
                });
                state.lastMark = { kind: "absent", ids: clue.guess.slice() };
                state.selectedClue = i;
                setFeedback(
                  "hint",
                  T("hintAbsent", {
                    clue: i + 1,
                    symbols: labelList(clue.guess),
                  }),
                );
                render();
                return;
              }
            }
            if (clue.phraseKey === "clueThreeWrong") {
              const others = poolIds.filter(function (id) {
                return clue.guess.indexOf(id) < 0;
              });
              const unmarked = others.filter(function (id) {
                return state.marks.absent[id] !== "no";
              });
              if (unmarked.length) {
                others.forEach(function (id) {
                  state.marks.absent[id] = "no";
                });
                clue.guess.forEach(function (id) {
                  state.marks.absent[id] = "yes";
                });
                state.lastMark = { kind: "absent", ids: others };
                state.selectedClue = i;
                setFeedback("hint", T("hintAbsentAll", { clue: i + 1 }));
                render();
                return;
              }
            }
          }
          for (let i = 0; i < clues.length; i++) {
            const clue = clues[i];
            if (clue.score.wellPlaced !== 0) continue;
            for (let slot = 0; slot < 3; slot++) {
              const id = clue.guess[slot];
              if (state.marks.absent[id] === "no") continue;
              if (state.marks.cells[slot][id] !== "no") {
                state.marks.cells[slot][id] = "no";
                state.lastMark = { kind: "cell", slot: slot, id: id };
                state.selectedClue = i;
                setFeedback(
                  "hint",
                  T("hintSlot", {
                    clue: i + 1,
                    symbol: labelFor(id),
                    slot: slot + 1,
                  }),
                );
                render();
                return;
              }
            }
          }
          for (let slot = 0; slot < 3; slot++) {
            const id = facts.confirmed[slot];
            if (id && state.marks.cells[slot][id] !== "yes") {
              state.marks.cells[slot][id] = "yes";
              state.lastMark = { kind: "cell", slot: slot, id: id };
              setFeedback(
                "hint",
                T("hintConfirm", { slot: slot + 1, symbol: labelFor(id) }),
              );
              render();
              return;
            }
          }
          if (!state.hintFlags.candShown) {
            state.hintFlags.candShown = true;
            setFeedback(
              "hint",
              T("hintCandidates", { count: markCandidates().length }),
            );
            render();
            return;
          }
          state.hintFlags.revealWait++;
          if (state.hintFlags.revealWait >= 2) {
            for (let slot = 0; slot < 3; slot++) {
              if (state.answer[slot] !== state.puzzle.code[slot]) {
                const id = state.puzzle.code[slot];
                state.undoStack.push(state.answer.slice());
                const other = state.answer.indexOf(id);
                if (other >= 0) state.answer[other] = null;
                state.answer[slot] = id;
                state.marks.cells[slot][id] = "yes";
                state.lastMark = { kind: "cell", slot: slot, id: id };
                state.hintFlags.revealWait = 0;
                setFeedback(
                  "hint",
                  T("hintReveal", { slot: slot + 1, symbol: labelFor(id) }),
                );
                render();
                return;
              }
            }
          }
          setFeedback("hint", T("hintNone"));
          render();
        }

        function showOverlay(tier, emoji, msg, sub) {
          const overlay = document.createElement("div");
          overlay.className = "result-overlay";
          overlay.style.background = OVERLAY_TIERS[tier];
          overlay.setAttribute("role", "dialog");
          overlay.setAttribute("aria-live", "polite");
          overlay.tabIndex = -1;
          const emojiEl = document.createElement("div");
          emojiEl.className = "overlay-emoji";
          emojiEl.textContent = emoji;
          overlay.appendChild(emojiEl);
          const msgEl = document.createElement("div");
          msgEl.className = "overlay-msg";
          msgEl.textContent = msg;
          overlay.appendChild(msgEl);
          if (sub) {
            const subEl = document.createElement("div");
            subEl.className = "overlay-sub";
            subEl.textContent = sub;
            overlay.appendChild(subEl);
          }
          const hintEl = document.createElement("div");
          hintEl.className = "overlay-hint";
          hintEl.textContent = T("ovDismiss");
          overlay.appendChild(hintEl);
          document.body.appendChild(overlay);
          overlay.focus();
          announce(msg + (sub ? " " + sub : ""));
          function onKey(event) {
            if (
              event.key === "Escape" ||
              event.key === "Enter" ||
              event.key === " "
            ) {
              event.preventDefault();
              event.stopPropagation();
              close();
            }
          }
          function close() {
            if (!overlay.parentNode) return;
            document.removeEventListener("keydown", onKey, true);
            overlay.remove();
            dom.nextBtn.focus();
          }
          overlay.addEventListener("click", close);
          document.addEventListener("keydown", onKey, true);
        }

        /* ================= RENDER (DOM) ================= */
        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        function symbolNode(variant, sym, sizeClass) {
          if (variant === "cards" && sym.suit) {
            const card = el("span", "pc " + sizeClass);
            card.style.color = sym.color || "";
            card.appendChild(el("span", "pc-rank", sym.rank));
            card.appendChild(el("span", "pc-pip", SUIT_GLYPHS[sym.suit]));
            return card;
          }
          const node = el("span", "", sym.label);
          node.style.color = sym.color || "";
          if (variant === "shapes" && SHAPE_SCALE[sym.id]) {
            node.style.fontSize = SHAPE_SCALE[sym.id] + "em";
          }
          return node;
        }

        const slotButtons = [];
        function buildSlots() {
          for (let i = 0; i < 3; i++) {
            const btn = el("button", "code-slot");
            btn.type = "button";
            btn.addEventListener("click", function () {
              if (consumeDragClick()) return;
              state.activeSlot = i;
              render();
            });
            bindDragSource(btn, function () {
              return { id: state.answer[i], fromSlot: i };
            });
            dom.slotRow.appendChild(btn);
            slotButtons.push(btn);
          }
        }

        function renderSlots() {
          const variant = currentVariantForBoard();
          for (let i = 0; i < 3; i++) {
            const btn = slotButtons[i];
            const id = state.answer[i];
            btn.classList.toggle("hosts-card", variant === "cards");
            while (btn.firstChild) btn.removeChild(btn.firstChild);
            if (id === null) {
              btn.appendChild(el("span", "slot-hint", "?"));
              btn.style.color = "";
              btn.setAttribute("aria-label", T("slotAriaEmpty", { n: i + 1 }));
            } else {
              const sym = symbolById(variant, id);
              btn.appendChild(symbolNode(variant, sym, "pc-lg"));
              btn.style.color = "";
              btn.setAttribute(
                "aria-label",
                T("slotAriaFilled", {
                  n: i + 1,
                  symbol: symbolAria(variant, sym),
                }),
              );
            }
            btn.classList.toggle("active", state.activeSlot === i);
          }
        }

        let traySignature = null;
        const trayButtons = [];
        function renderTray() {
          const symbols = currentPoolSymbols();
          const variant = currentVariantForBoard();
          const signature = variant + "|" + symbols.length + "|" + state.lang;
          if (signature !== traySignature) {
            traySignature = signature;
            trayButtons.length = 0;
            while (dom.symbolTray.firstChild) {
              dom.symbolTray.removeChild(dom.symbolTray.firstChild);
            }
            symbols.forEach(function (sym) {
              const hostsCard = variant === "cards" && !!sym.suit;
              const btn = el(
                "button",
                hostsCard ? "symbol-btn hosts-card" : "symbol-btn",
              );
              btn.type = "button";
              btn.appendChild(symbolNode(variant, sym, "pc-lg"));
              btn.setAttribute(
                "aria-label",
                T("trayAria", { symbol: symbolAria(variant, sym) }),
              );
              btn.title = symbolAria(variant, sym);
              btn.addEventListener("click", function () {
                if (consumeDragClick()) return;
                fillSlot(sym.id);
              });
              bindDragSource(btn, function () {
                return { id: sym.id, fromSlot: null };
              });
              dom.symbolTray.appendChild(btn);
              trayButtons.push({ id: sym.id, btn: btn });
            });
          }
          const locked = boardLocked();
          const selected =
            state.selectedClue !== null && state.puzzle
              ? state.puzzle.clues[state.selectedClue]
              : null;
          trayButtons.forEach(function (entry) {
            entry.btn.disabled = locked || state.answer.indexOf(entry.id) >= 0;
            entry.btn.classList.toggle(
              "crossed",
              state.marks.absent[entry.id] === "no",
            );
            entry.btn.classList.toggle(
              "clue-highlight",
              !!selected && selected.guess.indexOf(entry.id) >= 0,
            );
          });
        }

        function padPolicy() {
          if (!state.puzzle) return "manual";
          if (state.mode === "step") return "manual";
          return LEVELS[state.puzzle.level].marks;
        }

        function cycleMark(current) {
          if (current === "no") return "yes";
          if (current === "yes") return undefined;
          return "no";
        }

        function padMarkState(btn, mark, interactive, ariaBase) {
          btn.classList.toggle("mark-no", mark === "no");
          btn.classList.toggle("mark-yes", mark === "yes");
          btn.disabled = !interactive;
          const stateKey =
            mark === "no"
              ? "padMarkNo"
              : mark === "yes"
                ? "padMarkYes"
                : "padMarkNone";
          btn.setAttribute("aria-label", ariaBase + ", " + T(stateKey));
        }

        function pulseFresh(btn) {
          btn.classList.remove("fresh");
          void btn.offsetWidth;
          btn.classList.add("fresh");
        }

        let padSignature = null;
        const padButtons = [];
        function renderBoardPad() {
          const symbols = currentPoolSymbols();
          const variant = currentVariantForBoard();
          const signature = variant + "|" + symbols.length + "|" + state.lang;
          if (signature !== padSignature) {
            padSignature = signature;
            padButtons.length = 0;
            while (dom.padGrid.firstChild) {
              dom.padGrid.removeChild(dom.padGrid.firstChild);
            }
            symbols.forEach(function (sym) {
              const item = el("div", "pad-item");
              const entry = { id: sym.id, out: null, cells: [] };
              const outBtn = el("button", "pad-btn pad-out");
              outBtn.type = "button";
              if (variant === "cards" && sym.suit) {
                outBtn.classList.add("hosts-card");
              }
              outBtn.appendChild(symbolNode(variant, sym, "pc-lg"));
              outBtn.addEventListener("click", function () {
                if (outBtn.disabled) return;
                state.marks.absent[sym.id] = cycleMark(
                  state.marks.absent[sym.id],
                );
                state.lastMark = null;
                announcePadMark(
                  T("padAriaOut", { symbol: symbolAria(variant, sym) }),
                  state.marks.absent[sym.id],
                );
                evaluateStepProgress();
                render();
              });
              item.appendChild(outBtn);
              entry.out = outBtn;
              const dots = el("div", "pad-dots");
              for (let slot = 0; slot < 3; slot++) {
                (function (slotIndex) {
                  const dotBtn = el("button", "pad-dot", String(slotIndex + 1));
                  dotBtn.type = "button";
                  dotBtn.addEventListener("click", function () {
                    if (dotBtn.disabled) return;
                    state.marks.cells[slotIndex][sym.id] = cycleMark(
                      state.marks.cells[slotIndex][sym.id],
                    );
                    state.lastMark = null;
                    announcePadMark(
                      T("padAriaSlot", {
                        symbol: symbolAria(variant, sym),
                        slot: slotIndex + 1,
                      }),
                      state.marks.cells[slotIndex][sym.id],
                    );
                    evaluateStepProgress();
                    render();
                  });
                  dots.appendChild(dotBtn);
                  entry.cells.push(dotBtn);
                })(slot);
              }
              item.appendChild(dots);
              dom.padGrid.appendChild(item);
              padButtons.push(entry);
            });
          }
          const interactive = padPolicy() !== "auto" && !state.solved;
          padButtons.forEach(function (entry) {
            const sym = symbolById(variant, entry.id);
            padMarkState(
              entry.out,
              state.marks.absent[entry.id],
              interactive,
              T("padAriaOut", { symbol: symbolAria(variant, sym) }),
            );
            for (let slot = 0; slot < 3; slot++) {
              padMarkState(
                entry.cells[slot],
                state.marks.cells[slot][entry.id],
                interactive,
                T("padAriaSlot", {
                  symbol: symbolAria(variant, sym),
                  slot: slot + 1,
                }),
              );
              if (
                state.lastMark &&
                state.lastMark.kind === "cell" &&
                state.lastMark.slot === slot &&
                state.lastMark.id === entry.id
              ) {
                pulseFresh(entry.cells[slot]);
              }
            }
            if (
              state.lastMark &&
              state.lastMark.kind === "absent" &&
              state.lastMark.ids.indexOf(entry.id) >= 0
            ) {
              pulseFresh(entry.out);
            }
          });
        }

        function announcePadMark(base, mark) {
          const stateKey =
            mark === "no"
              ? "padMarkNo"
              : mark === "yes"
                ? "padMarkYes"
                : "padMarkNone";
          announce(base + ", " + T(stateKey));
        }

        function miniSymbolEl(variant, id) {
          const sym = symbolById(variant, id);
          if (variant === "cards" && sym.suit) {
            const node = el("span", "mini-symbol card");
            node.appendChild(symbolNode(variant, sym, "pc-sm"));
            node.title = symbolAria(variant, sym);
            return node;
          }
          const node = el("span", "mini-symbol");
          node.appendChild(symbolNode(variant, sym));
          node.title = symbolAria(variant, sym);
          return node;
        }

        // The Step By Step instruction shown on the active clue card: the
        // authored lesson for the guided case, a generic per-phrase line for
        // generated puzzles, plus the closing prompt once every clue is out.
        function clueInstruction(index) {
          const clue = state.puzzle.clues[index];
          const step = state.step;
          const lastRevealed =
            step &&
            step.satisfied &&
            step.revealed >= state.puzzle.clues.length;
          if (state.puzzle.guided) {
            let copy = T(GUIDED_COPY[index]);
            if (lastRevealed && index === state.puzzle.clues.length - 1) {
              copy += " " + T("stepFinal");
            }
            return copy;
          }
          const req = computeRequiredMarks(clue);
          let action;
          if (!req) action = T("stepReadOn");
          else if (req.kind === "absent") {
            action = T("stepMarkAbsent", { symbols: labelList(req.ids) });
          } else action = T("stepMarkSlots");
          let text = T(clue.phraseKey) + ". " + action;
          if (lastRevealed && index === state.puzzle.clues.length - 1) {
            text += " " + T("stepFinal");
          }
          return text;
        }

        let clueSignature = null;
        const clueCards = [];
        function renderBoardClues() {
          const puzzle = state.puzzle;
          const key = !puzzle
            ? "none"
            : puzzle.variant +
              "|" +
              puzzle.seed +
              "|" +
              puzzle.code.join(",") +
              "|" +
              puzzle.clues.length +
              "|" +
              state.lang;
          if (key !== clueSignature) {
            clueSignature = key;
            clueCards.length = 0;
            while (dom.clueList.firstChild) {
              dom.clueList.removeChild(dom.clueList.firstChild);
            }
            if (puzzle) {
              puzzle.clues.forEach(function (clue, index) {
                const card = el("div", "board-clue");
                const head = el("button", "clue-head");
                head.type = "button";
                head.appendChild(
                  el("span", "clue-tag", T("clueTag", { n: index + 1 })),
                );
                const row = el("span", "mini-row");
                clue.guess.forEach(function (id) {
                  row.appendChild(miniSymbolEl(puzzle.variant, id));
                });
                head.appendChild(row);
                head.appendChild(
                  el("span", "clue-short", T(SHORT_KEYS[clue.phraseKey])),
                );
                const badge = el("span", "clue-badge", "✕");
                badge.hidden = true;
                head.appendChild(badge);
                head.setAttribute(
                  "aria-label",
                  T("clueAria", { n: index + 1, label: T(clue.phraseKey) }),
                );
                head.addEventListener("click", function () {
                  state.selectedClue =
                    state.selectedClue === index ? null : index;
                  render();
                });
                card.appendChild(head);
                const detail = el("div", "clue-detail");
                detail.hidden = true;
                const sentence = el("p", "clue-sentence", "");
                detail.appendChild(sentence);
                const markBtn = el(
                  "button",
                  "action-btn clue-mark-btn",
                  T("markFromClue"),
                );
                markBtn.type = "button";
                markBtn.hidden = true;
                markBtn.addEventListener("click", function () {
                  applyClueMarks(index);
                });
                detail.appendChild(markBtn);
                card.appendChild(detail);
                if (!state.reduceMotion) {
                  card.classList.add("reveal");
                  card.style.animationDelay = index * 60 + "ms";
                }
                dom.clueList.appendChild(card);
                clueCards.push({
                  root: card,
                  head: head,
                  badge: badge,
                  detail: detail,
                  sentence: sentence,
                  markBtn: markBtn,
                  wasActive: false,
                });
              });
            }
          }
          if (!puzzle) return;
          const step = state.mode === "step" ? state.step : null;
          clueCards.forEach(function (entry, index) {
            const clue = puzzle.clues[index];
            const revealed = !step || index < step.revealed;
            const isActive =
              !!step && index === step.revealed - 1 && !state.solved;
            entry.root.hidden = !revealed;
            entry.root.classList.toggle("step-active", isActive);
            entry.root.classList.toggle(
              "collapsed",
              !!step &&
                revealed &&
                !isActive &&
                state.selectedClue !== index &&
                !state.solved,
            );
            entry.root.classList.toggle(
              "selected",
              state.selectedClue === index,
            );
            entry.root.classList.toggle(
              "violated",
              state.violatedClue === index,
            );
            const marked = clueMarksApplied(index);
            entry.badge.hidden = !marked;
            let open = false;
            let text = "";
            let showMark = false;
            if (isActive) {
              open = true;
              text = clueInstruction(index);
              showMark = !!step.requiredMarks && !step.satisfied;
            } else if (state.selectedClue === index) {
              open = true;
              text = T(clue.phraseKey) + ".";
              showMark =
                !!computeRequiredMarks(clue) && !marked && !state.solved;
            }
            entry.detail.hidden = !open;
            entry.head.setAttribute("aria-expanded", open ? "true" : "false");
            entry.sentence.textContent = text;
            entry.markBtn.hidden = !showMark;
            if (isActive && !entry.wasActive && !state.reduceMotion) {
              entry.root.style.animationDelay = "0ms";
              entry.root.classList.remove("reveal");
              void entry.root.offsetWidth;
              entry.root.classList.add("reveal");
            }
            entry.wasActive = isActive;
          });
        }

        function renderVisibility() {
          const started = state.started;
          dom.launcher.hidden = started;
          dom.modeSection.hidden = !started;
          dom.summarySection.hidden = !started;
          dom.settingsSection.hidden = !started && !state.settingsOpen;
          dom.settingsBody.hidden = !state.settingsOpen;
          dom.boardIdle.hidden = started;
          dom.gameBoard.hidden = !started;
          dom.stagePrompt.hidden = !started;
          dom.padWrap.hidden =
            !started || !state.puzzle || padPolicy() === "auto";
          dom.padGrid.hidden = !state.padOpen;
          const cfg = state.puzzle ? LEVELS[state.puzzle.level] : null;
          dom.candidateRow.hidden = !cfg || !cfg.showCandidates;
          dom.feedbackCard.hidden = !state.feedback;
          dom.solvedStamp.hidden = !state.solved;
          dom.hintBtn.hidden = state.mode === "step";
          dom.nextBtn.hidden = state.mode !== "step" && !state.solved;
        }

        function renderSummary() {
          const level = state.puzzle ? state.puzzle.level : state.level;
          const variant = state.puzzle ? state.puzzle.variant : state.variant;
          dom.levelChip.textContent = T("levelChip", { level: level });
          dom.variantChip.textContent = T(variant);
        }

        function renderReadouts() {
          if (!dom.candidateRow.hidden && state.puzzle) {
            dom.candidateReadout.textContent = String(markCandidates().length);
          } else {
            dom.candidateReadout.textContent = "—";
          }
          let total = 0;
          [1, 2, 3, 4, 5].forEach(function (level) {
            total += state.progress.solvedByLevel[level] || 0;
          });
          dom.progressReadout.textContent = T("progressLine", {
            solved: total,
            levelSolved: state.progress.solvedByLevel[state.level] || 0,
          });
          while (dom.settingsProgress.firstChild) {
            dom.settingsProgress.removeChild(dom.settingsProgress.firstChild);
          }
          if (state.settingsOpen) {
            [1, 2, 3, 4, 5].forEach(function (level) {
              const row = el("div", "readout-row");
              row.appendChild(
                el("span", "readout-label", T("levelChip", { level: level })),
              );
              row.appendChild(
                el(
                  "span",
                  "readout-val",
                  T("settingsLevelLine", {
                    solved: state.progress.solvedByLevel[level] || 0,
                    perfect: state.progress.perfectByLevel[level] || 0,
                  }),
                ),
              );
              dom.settingsProgress.appendChild(row);
            });
          }
        }

        function renderActions() {
          const step = state.mode === "step" ? state.step : null;
          const allRevealed =
            !step ||
            !state.puzzle ||
            step.revealed >= state.puzzle.clues.length;
          dom.checkBtn.textContent = T("check");
          dom.checkBtn.disabled =
            state.solved || !answerComplete() || !allRevealed;
          let nextLabel = T("next");
          let nextDisabled = false;
          let nextReady = false;
          if (step && !state.solved) {
            const guided = !!state.puzzle && !!state.puzzle.guided;
            nextDisabled = allRevealed || (guided && !step.satisfied);
            nextReady = !allRevealed && step.satisfied;
          } else if (state.solved) {
            nextLabel = T("newCase");
          }
          dom.nextBtn.textContent = nextLabel;
          dom.nextBtn.disabled = nextDisabled;
          dom.nextBtn.classList.toggle("primary", nextReady);
          dom.hintBtn.disabled = !state.puzzle || state.solved;
          const canEdit = !boardLocked();
          dom.undoBtn.disabled = !canEdit || state.undoStack.length === 0;
          dom.clearBtn.disabled =
            !canEdit ||
            state.answer.every(function (v) {
              return v === null;
            });
        }

        function renderFeedback() {
          if (!state.feedback) return;
          dom.feedbackCard.className = "feedback-card " + state.feedback.type;
          dom.feedbackCard.textContent = state.feedback.text;
        }

        function renderOptions() {
          dom.modeStepBtn.classList.toggle("active", state.mode === "step");
          dom.modeAllBtn.classList.toggle("active", state.mode === "all");
          Array.prototype.forEach.call(
            dom.variantGrid.children,
            function (btn) {
              btn.classList.toggle(
                "active",
                btn.dataset.variant === state.variant,
              );
            },
          );
          const recommended = recommendedLevel();
          Array.prototype.forEach.call(dom.levelRow.children, function (btn) {
            const level = Number(btn.dataset.level);
            btn.classList.toggle("active", level === state.level);
            btn.classList.toggle("recommended", level === recommended);
          });
        }

        function recommendedLevel() {
          for (let level = 1; level <= 5; level++) {
            if ((state.progress.solvedByLevel[level] || 0) < 5) return level;
          }
          return 5;
        }

        function renderPrompt() {
          let text;
          let cls = "stage-prompt";
          if (state.solved) {
            text = T("promptSolved");
            cls += " highlight";
          } else if (state.mode === "step") {
            text = T("promptStep");
          } else {
            text = T("promptCase");
          }
          dom.stagePrompt.textContent = text;
          dom.stagePrompt.className = cls;
        }

        function buildGlossary() {
          while (dom.glossaryList.firstChild) {
            dom.glossaryList.removeChild(dom.glossaryList.firstChild);
          }
          PHRASE_KEYS.forEach(function (key) {
            const item = el("div", "glossary-item");
            item.appendChild(el("strong", "", T(key)));
            item.appendChild(
              document.createTextNode(" — " + T("mean" + key.slice(4))),
            );
            dom.glossaryList.appendChild(item);
          });
        }

        function applyTranslations() {
          document.title = T("docTitle");
          document.documentElement.lang = state.lang;
          dom.titleText.textContent = T("title");
          dom.subtitleText.textContent = T("subtitle");
          dom.langBtn.textContent = state.lang === "en" ? "PL" : "EN";
          dom.langBtn.title = T("langTitle");
          dom.langBtn.setAttribute("aria-label", T("langTitle"));
          const homeLink = document.querySelector("header h1 a");
          if (homeLink) homeLink.setAttribute("aria-label", T("homeAria"));
          dom.gameBoard.setAttribute("aria-label", T("boardAria"));
          dom.boardIdleText.textContent = T("promptIdle");
          dom.lblMode.textContent = T("mode");
          dom.lblSummary.textContent = T("lblSummary");
          dom.lblVariant.textContent = T("variant");
          dom.lblLevel.textContent = T("level");
          dom.lblProgress.textContent = T("progress");
          dom.lblCandidates.textContent = T("lblCandidates");
          dom.launcherTitle.textContent = T("launcherTitle");
          dom.launcherText.textContent = T("launcherText");
          dom.startCaseBtn.textContent = T("startPuzzle");
          dom.launcherSettingsBtn.textContent = T("settings");
          dom.modeStepBtn.textContent = T("modeStep");
          dom.modeAllBtn.textContent = T("modeAll");
          dom.newPuzzleBtn.textContent = T("newPuzzle");
          dom.settingsBtn.textContent = T("settings");
          dom.padToggleBtn.textContent = T("lblPad");
          dom.hintBtn.textContent = T("hint");
          dom.undoBtn.textContent = T("undo");
          dom.clearBtn.textContent = T("clear");
          dom.glossaryBtn.textContent = T("glossaryBtn");
          dom.helpBtn.textContent = T("helpBtn");
          dom.helpText1.textContent = T("help1");
          dom.helpText2.textContent = T("help2");
          dom.helpKeys.textContent = T("helpKeys");
          Array.prototype.forEach.call(
            dom.variantGrid.children,
            function (btn) {
              btn.textContent = T(btn.dataset.variant);
            },
          );
          buildGlossary();
          traySignature = null;
          padSignature = null;
          clueSignature = null;
          render();
        }

        function render() {
          renderVisibility();
          renderSummary();
          renderSlots();
          renderTray();
          renderBoardClues();
          renderBoardPad();
          renderReadouts();
          renderActions();
          renderFeedback();
          renderOptions();
          renderPrompt();
        }

        /* ================= DRAG & DROP ================= */
        let dragState = null;
        let dragClickGuard = false;

        function consumeDragClick() {
          if (dragClickGuard) {
            dragClickGuard = false;
            return true;
          }
          return false;
        }

        function bindDragSource(btn, getPayload) {
          btn.addEventListener("pointerdown", function (event) {
            if (dragState || boardLocked()) return;
            if (event.button !== undefined && event.button !== 0) return;
            const payload = getPayload();
            if (!payload || payload.id === null) return;
            dragState = {
              id: payload.id,
              fromSlot: payload.fromSlot,
              source: btn,
              startX: event.clientX,
              startY: event.clientY,
              pointerId: event.pointerId,
              started: false,
              ghost: null,
            };
            try {
              btn.setPointerCapture(event.pointerId);
            } catch {
              /* pointer capture unavailable */
            }
          });
          btn.addEventListener("pointermove", onDragMove);
          btn.addEventListener("pointerup", onDragEnd);
          btn.addEventListener("pointercancel", onDragCancel);
        }

        function onDragMove(event) {
          if (!dragState || event.pointerId !== dragState.pointerId) return;
          const dx = event.clientX - dragState.startX;
          const dy = event.clientY - dragState.startY;
          if (!dragState.started) {
            if (dx * dx + dy * dy < 36) return;
            dragState.started = true;
            const variant = currentVariantForBoard();
            const sym = symbolById(variant, dragState.id);
            const ghost = el("span", "drag-ghost");
            if (variant === "cards" && sym.suit) {
              ghost.classList.add("hosts-card");
            }
            ghost.appendChild(symbolNode(variant, sym, "pc-lg"));
            document.body.appendChild(ghost);
            dragState.ghost = ghost;
            dragState.source.classList.add("drag-source");
          }
          event.preventDefault();
          moveGhost(event.clientX, event.clientY);
          const target = slotIndexAt(event.clientX, event.clientY);
          slotButtons.forEach(function (slot, i) {
            slot.classList.toggle("drop-hover", i === target);
          });
        }

        function moveGhost(x, y) {
          if (!dragState || !dragState.ghost) return;
          const ghost = dragState.ghost;
          ghost.style.left = x - (ghost.offsetWidth || 52) / 2 + "px";
          ghost.style.top = y - (ghost.offsetHeight || 52) / 2 + "px";
        }

        function slotIndexAt(x, y) {
          for (let i = 0; i < 3; i++) {
            const rect = slotButtons[i].getBoundingClientRect();
            if (
              x >= rect.left &&
              x <= rect.right &&
              y >= rect.top &&
              y <= rect.bottom
            ) {
              return i;
            }
          }
          return -1;
        }

        function clearDragVisuals() {
          if (dragState && dragState.ghost) dragState.ghost.remove();
          if (dragState && dragState.source) {
            dragState.source.classList.remove("drag-source");
          }
          slotButtons.forEach(function (slot) {
            slot.classList.remove("drop-hover");
          });
        }

        function onDragEnd(event) {
          if (!dragState || event.pointerId !== dragState.pointerId) return;
          const drag = dragState;
          clearDragVisuals();
          dragState = null;
          if (!drag.started) return;
          dragClickGuard = true;
          setTimeout(function () {
            dragClickGuard = false;
          }, 0);
          applyDrop(drag, slotIndexAt(event.clientX, event.clientY));
        }

        function onDragCancel(event) {
          if (!dragState || event.pointerId !== dragState.pointerId) return;
          clearDragVisuals();
          dragState = null;
        }

        function cancelDrag() {
          if (!dragState) return;
          clearDragVisuals();
          dragState = null;
        }

        function nextEmptySlotFrom(index) {
          for (let i = 0; i <= 3; i++) {
            const idx = (index + i) % 3;
            if (state.answer[idx] === null) return idx;
          }
          return index;
        }

        function applyDrop(drag, target) {
          if (boardLocked()) return;
          const variant = currentVariantForBoard();
          if (drag.fromSlot === null) {
            if (target < 0 || state.answer.indexOf(drag.id) >= 0) return;
            state.undoStack.push(state.answer.slice());
            state.answer[target] = drag.id;
            state.activeSlot = nextEmptySlotFrom(target);
            announce(
              T("slotAriaFilled", {
                n: target + 1,
                symbol: symbolAria(variant, symbolById(variant, drag.id)),
              }),
            );
          } else if (target < 0) {
            if (state.answer[drag.fromSlot] === null) return;
            state.undoStack.push(state.answer.slice());
            state.answer[drag.fromSlot] = null;
            state.activeSlot = drag.fromSlot;
            announce(T("slotAriaEmpty", { n: drag.fromSlot + 1 }));
          } else if (target !== drag.fromSlot) {
            state.undoStack.push(state.answer.slice());
            const swapped = state.answer[target];
            state.answer[target] = drag.id;
            state.answer[drag.fromSlot] = swapped;
            state.activeSlot =
              swapped === null ? nextEmptySlotFrom(target) : target;
            announce(
              T("slotAriaFilled", {
                n: target + 1,
                symbol: symbolAria(variant, symbolById(variant, drag.id)),
              }),
            );
          } else {
            return;
          }
          render();
        }

        /* ================= EVENTS & INIT ================= */
        function restartForOptionChange() {
          if (!state.started) {
            render();
            return;
          }
          setMode(state.mode);
        }

        function handleKeydown(event) {
          const key = event.key;
          const target = event.target;
          const tag = target && target.tagName;
          const isButtonTarget = tag === "BUTTON" || tag === "A";
          if (key === "Escape") {
            if (dragState) {
              cancelDrag();
              return;
            }
            if (state.selectedClue !== null) {
              state.selectedClue = null;
              render();
            }
            return;
          }
          if (isButtonTarget && (key === "Enter" || key === " ")) return;
          if (key === "ArrowLeft" || key === "ArrowRight") {
            if (boardLocked()) return;
            event.preventDefault();
            const delta = key === "ArrowLeft" ? -1 : 1;
            state.activeSlot = Math.min(
              2,
              Math.max(0, state.activeSlot + delta),
            );
            render();
            return;
          }
          if (key === "Backspace" || key === "Delete") {
            event.preventDefault();
            clearActiveSlot();
            return;
          }
          if (key === "Enter") {
            if (answerComplete() && !dom.checkBtn.disabled) {
              event.preventDefault();
              checkAnswer();
            }
            return;
          }
          if (
            key &&
            key.length === 1 &&
            !event.metaKey &&
            !event.ctrlKey &&
            !event.altKey
          ) {
            const id = key.toUpperCase();
            if (currentPoolIds().indexOf(id) >= 0) {
              event.preventDefault();
              fillSlot(id);
            }
          }
        }

        function toggleDisclosure(btn, body) {
          body.hidden = !body.hidden;
          btn.setAttribute("aria-expanded", String(!body.hidden));
        }

        function bindEvents() {
          dom.langBtn.addEventListener("click", function () {
            state.lang = state.lang === "en" ? "pl" : "en";
            applyTranslations();
          });
          dom.startCaseBtn.addEventListener("click", function () {
            markIntroSeen();
            setMode(state.progress.guidedDone ? "all" : "step");
          });
          dom.launcherSettingsBtn.addEventListener("click", function () {
            state.settingsOpen = true;
            render();
            dom.settingsBtn.setAttribute("aria-expanded", "true");
            dom.settingsBtn.focus();
          });
          dom.modeStepBtn.addEventListener("click", function () {
            if (state.mode !== "step") setMode("step");
          });
          dom.modeAllBtn.addEventListener("click", function () {
            if (state.mode !== "all") setMode("all");
          });
          dom.newPuzzleBtn.addEventListener("click", function () {
            newCase();
          });
          dom.settingsBtn.addEventListener("click", function () {
            state.settingsOpen = !state.settingsOpen;
            dom.settingsBtn.setAttribute(
              "aria-expanded",
              String(state.settingsOpen),
            );
            render();
          });
          dom.padToggleBtn.addEventListener("click", function () {
            state.padOpen = !state.padOpen;
            dom.padToggleBtn.setAttribute(
              "aria-expanded",
              String(state.padOpen),
            );
            render();
          });
          Array.prototype.forEach.call(
            dom.variantGrid.children,
            function (btn) {
              btn.addEventListener("click", function () {
                if (state.variant === btn.dataset.variant) return;
                state.variant = btn.dataset.variant;
                saveProgress();
                restartForOptionChange();
              });
            },
          );
          Array.prototype.forEach.call(dom.levelRow.children, function (btn) {
            btn.addEventListener("click", function () {
              const level = Number(btn.dataset.level);
              if (state.level === level) return;
              state.level = level;
              saveProgress();
              restartForOptionChange();
            });
          });
          dom.checkBtn.addEventListener("click", checkAnswer);
          dom.nextBtn.addEventListener("click", nextAction);
          dom.hintBtn.addEventListener("click", requestHint);
          dom.undoBtn.addEventListener("click", undoAnswer);
          dom.clearBtn.addEventListener("click", clearAnswer);
          dom.glossaryBtn.addEventListener("click", function () {
            toggleDisclosure(dom.glossaryBtn, dom.glossaryList);
          });
          dom.helpBtn.addEventListener("click", function () {
            toggleDisclosure(dom.helpBtn, dom.helpBody);
          });
          document.addEventListener("keydown", handleKeydown);
          motionQuery.addEventListener("change", function () {
            state.reduceMotion = motionQuery.matches;
          });
        }

        function init() {
          loadProgress();
          state.mode = state.progress.guidedDone ? "all" : "step";
          buildSlots();
          bindEvents();
          dom.glossaryBtn.setAttribute("aria-expanded", "false");
          dom.helpBtn.setAttribute("aria-expanded", "false");
          dom.settingsBtn.setAttribute("aria-expanded", "false");
          dom.padToggleBtn.setAttribute("aria-expanded", "true");
          if (introSeen()) {
            state.started = true;
            newCase();
          }
          applyTranslations();
        }

        init();

        /* ================= DEBUG (gated behind ?debug=1) ================= */
        const debugSearch =
          typeof location === "undefined" ? "" : location.search || "";
        if (/[?&]debug=1(?:&|$)/.test(debugSearch)) {
          window.__codebreak = {
            state: state,
            engine: {
              scoreGuess: scoreGuess,
              scoreKey: scoreKey,
              enumerateCodes: enumerateCodes,
              filterCandidates: filterCandidates,
              getSymbolPool: getSymbolPool,
              generatePuzzle: generatePuzzle,
            },
            newCase: newCase,
            requestHint: requestHint,
            checkAnswer: checkAnswer,
            render: render,
          };
        }
      })();
    </script>
  </body>
</html>
