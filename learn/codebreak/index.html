Use it as the final review gate. It enforces the single-file HTML app policy plus HTML, CSS, JavaScript, formatting, and architecture checks.
The puzzle engine is additionally verified by `node tools/codebreak-puzzle-check.mjs` (run from learn/).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Breaker</title>
    <meta
      name="description"
      content="Code Breaker — crack hidden three-symbol codes from exact clues. A kid-friendly deduction game with numbers, letters, cards, and shapes."
    />
    <meta name="author" content="Łukasz Łepecki" />
    <link rel="canonical" href="https://lepecki.com/learn/codebreak/" />
    <meta property="og:title" content="Code Breaker" />
    <meta
      property="og:description"
      content="Code Breaker — crack hidden three-symbol codes from exact clues. A kid-friendly deduction game with numbers, letters, cards, and shapes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lepecki.com/learn/codebreak/" />
    <meta property="og:site_name" content="Łukasz Łepecki" />
    <meta
      property="og:image"
      content="https://lepecki.com/assets/img/avatar.webp"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Code Breaker" />
    <meta
      name="twitter:description"
      content="Code Breaker — crack hidden three-symbol codes from exact clues. A kid-friendly deduction game with numbers, letters, cards, and shapes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #fafaf7;
        --panel: #ffffff;
        --panel-border: #e0ddd6;
        --text: #37474f;
        --text-head: #263238;
        --text-dim: #78909c;
        --text-label: #90a4ae;
        --accent: #455a64;
        --accent-light: #eceff1;
        --canvas-bg: #f5f3ee;
        --perfect: #00c853;
        --close: #1976d2;
        --far: #f9a825;
        --miss: #d32f2f;
        --paper: #fdf6e3;
        --paper-border: #e8dcc0;
        --teal: #00897b;
        --amber: #f9a825;
        --coral: #e53935;
        --ink: #607d8b;
        --card-red: #d32f2f;
      }
      body {
        background: linear-gradient(160deg, #fafaf7 0%, #f0ede6 100%);
        color: var(--text);
        font-family: "Outfit", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .panel-section[hidden],
      .settings-body[hidden],
      .task-chip[hidden],
      .game-board[hidden],
      .board-idle[hidden],
      .board-pad[hidden],
      .pad-grid[hidden],
      .slot-row[hidden],
      .symbol-tray[hidden],
      .btn-row[hidden],
      .feedback-card[hidden],
      .glossary-list[hidden],
      .board-clue[hidden],
      .clue-detail[hidden],
      .clue-badge[hidden],
      .solved-stamp[hidden],
      .readout-row[hidden],
      .help-body[hidden],
      .stage-prompt[hidden],
      .action-btn[hidden] {
        display: none;
      }

      /* ===== Header ===== */
      header {
        padding: 6px 28px 5px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .header-text {
        flex: 1;
      }
      header h1 {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-head);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header h1 a {
        color: inherit;
        text-decoration: none;
      }
      header h1 a:hover {
        opacity: 0.7;
      }
      header p {
        margin-top: 1px;
        font-size: 12px;
        color: var(--text-dim);
      }
      .header-icon {
        font-size: 18px;
        line-height: 1;
      }
      .lang-btn {
        background: none;
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
        flex-shrink: 0;
        color: var(--text-dim);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .lang-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ===== Layout ===== */
      .main {
        display: flex;
        height: calc(100vh - 46px);
      }
      .stage-wrap {
        flex: 1;
        position: relative;
        min-width: 0;
        background: var(--canvas-bg);
        border-right: 1px solid var(--panel-border);
      }
      .stage-prompt {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-dim);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--panel-border);
        pointer-events: none;
        white-space: nowrap;
        z-index: 5;
        max-width: calc(100% - 40px);
        overflow: hidden;
        text-overflow: ellipsis;
        transition:
          color 0.3s,
          border-color 0.3s,
          background 0.3s;
      }
      .stage-prompt.highlight {
        color: var(--perfect);
        border-color: var(--perfect);
      }
      .board-idle {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--text-label);
        pointer-events: none;
      }
      .board-idle-emoji {
        font-size: 56px;
      }
      .board-idle p {
        font-size: 14px;
        font-weight: 600;
      }
      .game-board {
        height: 100%;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
        gap: 24px;
        padding: 72px 24px 24px;
      }
      /* Short windows: tighten the board rhythm so the densest case (six
         card clues) stays clear of the clue board's internal scroll. */
      @media (max-height: 760px) {
        .game-board {
          gap: 18px;
          padding: 64px 24px 20px;
        }
      }
      .board-answer {
        display: flex;
        justify-content: center;
        gap: 12px;
        position: relative;
      }
      .clue-board {
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        align-content: start;
      }
      .board-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .board-actions .btn-row {
        justify-content: center;
      }
      .board-actions .action-btn {
        flex: 0 0 auto;
        min-width: 88px;
      }
      .board-actions .feedback-card {
        max-width: 560px;
        width: 100%;
      }
      .solved-stamp {
        position: absolute;
        right: 8%;
        top: -8px;
        transform: rotate(-8deg);
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        letter-spacing: 2px;
        color: var(--teal);
        border: 3px solid var(--teal);
        border-radius: 8px;
        padding: 4px 14px;
        background: rgba(255, 255, 255, 0.7);
        animation: overlayPop 0.4s ease;
        pointer-events: none;
        z-index: 4;
      }
      .panel {
        width: 320px;
        flex-shrink: 0;
        background: var(--panel);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .panel-section {
        padding: 14px 20px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel-section.grow {
        flex: 1;
      }
      .section-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-label);
      }

      /* ===== Launcher ===== */
      .launcher-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-head);
      }
      .launcher-text {
        font-size: 13px;
        color: #546e7a;
        line-height: 1.5;
      }

      /* ===== Puzzle summary ===== */
      .task-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .task-chip {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-dim);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 2px 8px;
      }

      /* ===== Settings ===== */
      .settings-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .settings-progress {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      /* ===== Answer slots & tray ===== */
      .slot-row {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      /* One tile chassis wherever a symbol sits: answer slots, symbol tray,
         and the scratchpad. Same size, border, and rendering everywhere so a
         tile never changes shape as it moves between rows. */
      .code-slot,
      .symbol-btn,
      .pad-btn.pad-out {
        position: relative;
        min-width: 58px;
        height: 58px;
        padding: 0 6px;
        border-radius: 6px;
        border: 1.5px solid var(--panel-border);
        background: #fafaf7;
        color: var(--text-head);
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .code-slot.hosts-card,
      .symbol-btn.hosts-card,
      .pad-btn.pad-out.hosts-card,
      .drag-ghost.hosts-card {
        height: 76px;
        padding: 4px;
      }
      .code-slot {
        width: 58px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .code-slot.drop-hover {
        border-color: var(--accent);
        border-style: dashed;
        background: var(--accent-light);
      }
      .code-slot:hover {
        border-color: var(--accent);
      }
      .code-slot.active {
        border-color: var(--accent);
        background: var(--accent-light);
      }
      .code-slot .slot-hint {
        font-size: 16px;
        color: var(--text-label);
      }
      .code-slot:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .symbol-tray {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .symbol-btn {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Absent symbols: a red ring and light red wash, no overlay glyph. */
      .symbol-btn.crossed {
        border-color: var(--coral);
        background: #fdf2f1;
      }
      .symbol-btn.clue-highlight {
        border-color: var(--teal);
        background: #eef7f6;
      }
      .drag-source {
        opacity: 0.4;
      }
      .drag-ghost {
        position: fixed;
        z-index: 10000;
        pointer-events: none;
        opacity: 0.9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 58px;
        height: 58px;
        padding: 0 6px;
        border-radius: 6px;
        border: 1.5px solid var(--panel-border);
        background: #fafaf7;
        color: var(--text-head);
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        box-shadow: 0 4px 10px rgba(38, 50, 56, 0.18);
      }

      /* ===== Mini playing cards ===== */
      .pc {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        border: 1px solid #b0bec5;
        border-radius: 5px;
        flex-shrink: 0;
      }
      .pc-rank {
        position: absolute;
        top: 3px;
        left: 5px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        line-height: 1;
      }
      .pc-pip {
        font-size: 24px;
        line-height: 1;
        margin-top: 8px;
      }
      .pc-lg {
        width: 45px;
        height: 61px;
      }
      .pc-sm {
        width: 29px;
        height: 40px;
      }
      .pc-sm .pc-rank {
        top: 2px;
        left: 3px;
        font-size: 12px;
      }
      .pc-sm .pc-pip {
        font-size: 15px;
        margin-top: 7px;
      }
      .mini-symbol.card {
        background: none;
        border: none;
        padding: 0;
        min-width: 0;
        height: auto;
      }
      .symbol-btn:hover:not(:disabled) {
        background: #f0ede6;
        border-color: var(--accent);
      }
      .symbol-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .symbol-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ===== Action buttons ===== */
      .btn-row {
        display: flex;
        gap: 8px;
      }
      .action-btn {
        flex: 1;
        padding: 10px 8px;
        border-radius: 6px;
        border: 1.5px solid var(--panel-border);
        background: #fafaf7;
        color: var(--text);
        font-family: "Outfit", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
        touch-action: manipulation;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .action-btn:hover:not(:disabled) {
        background: #f0ede6;
        border-color: var(--accent);
        color: var(--accent);
      }
      .action-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .action-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Panel buttons sit in column flex parents: keep natural height. */
      .panel-section > .action-btn,
      .settings-body > .action-btn {
        flex: none;
      }
      .action-btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .action-btn.primary:hover:not(:disabled) {
        background: #37474f;
        border-color: #37474f;
        color: #fff;
      }

      /* ===== Feedback card ===== */
      .feedback-card {
        border: 1px solid var(--panel-border);
        border-left: 4px solid var(--text-dim);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
        color: #546e7a;
        line-height: 1.5;
        background: #fafaf7;
      }
      .feedback-card.perfect {
        border-left-color: var(--perfect);
      }
      .feedback-card.close {
        border-left-color: var(--close);
      }
      .feedback-card.far {
        border-left-color: var(--far);
      }
      .feedback-card.miss {
        border-left-color: var(--miss);
      }
      .feedback-card.hint {
        border-left-color: var(--teal);
      }

      /* ===== Clue cards ===== */
      .board-clue {
        background: var(--paper);
        border: 1px solid var(--paper-border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-self: start;
      }
      .board-clue.reveal {
        animation: cluePop 0.3s ease both;
      }
      .board-clue.selected {
        border-color: var(--accent);
      }
      .board-clue.step-active {
        border-color: var(--teal);
      }
      .board-clue.violated {
        border-color: var(--miss);
      }
      .board-clue.collapsed .mini-row,
      .board-clue.collapsed .clue-short {
        display: none;
      }
      .clue-head {
        background: none;
        border: none;
        padding: 8px 10px;
        cursor: pointer;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        text-align: left;
        width: 100%;
        font-family: "Outfit", sans-serif;
        border-radius: 8px;
        touch-action: manipulation;
      }
      .clue-head:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .clue-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-label);
      }
      .clue-short {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-head);
      }
      .clue-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--coral);
        border: 1px solid currentColor;
        border-radius: 8px;
        padding: 1px 6px;
        margin-left: auto;
      }
      .clue-detail {
        padding: 0 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .clue-sentence {
        font-size: 12px;
        color: #546e7a;
        line-height: 1.4;
      }
      .clue-mark-btn {
        flex: none;
        min-height: 36px;
        padding: 6px 10px;
        align-self: flex-start;
      }
      .mini-row {
        display: flex;
        gap: 6px;
      }
      .mini-symbol {
        min-width: 34px;
        height: 34px;
        padding: 0 4px;
        border: 1px solid var(--paper-border);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text-head);
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @keyframes cluePop {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ===== Glossary ===== */
      .glossary-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .glossary-item {
        font-size: 12px;
        color: #546e7a;
        line-height: 1.4;
      }
      .glossary-item strong {
        color: var(--text-head);
        font-weight: 600;
      }

      /* ===== Scratchpad ===== */
      .board-pad {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .pad-toggle {
        background: none;
        border: none;
        cursor: pointer;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-label);
        padding: 4px 8px;
        transition: color 0.15s;
        touch-action: manipulation;
      }
      .pad-toggle:hover {
        color: var(--accent);
      }
      .pad-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .pad-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .pad-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .pad-btn {
        border-radius: 6px;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        color: var(--ink);
        font-family: "JetBrains Mono", monospace;
        cursor: pointer;
        transition: all 0.15s;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pad-dots {
        display: flex;
        gap: 3px;
      }
      .pad-dot {
        width: 21px;
        height: 21px;
        border-radius: 50%;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        color: var(--text-label);
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .pad-btn:hover:not(:disabled),
      .pad-dot:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .pad-btn:disabled,
      .pad-dot:disabled {
        cursor: default;
      }
      .pad-btn:focus-visible,
      .pad-dot:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .pad-btn.mark-no {
        color: var(--coral);
        border-color: var(--coral);
        background: #fdf2f1;
      }
      /* Slot dots say "not in THIS place" — amber, matching the palette's
         wrong-place accent: the symbol may well be in the code, just
         elsewhere. Digit in a darker orange for legibility. */
      .pad-dot.mark-no {
        color: #ef6c00;
        border-color: var(--amber);
        background: #fdf3df;
      }
      .pad-btn.mark-yes,
      .pad-dot.mark-yes {
        color: var(--teal);
        border-color: var(--teal);
        background: #eef7f6;
      }
      .pad-btn.fresh,
      .pad-dot.fresh {
        animation: markPulse 0.6s ease;
      }

      /* ===== Readouts ===== */
      .readout-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .readout-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-label);
      }
      .readout-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-head);
      }

      /* ===== Options ===== */
      .opt-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .opt-btn {
        padding: 10px 8px;
        border-radius: 6px;
        border: 1.5px solid var(--panel-border);
        background: #fafaf7;
        color: #546e7a;
        font-family: "Outfit", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
        touch-action: manipulation;
        min-height: 44px;
      }
      .opt-btn:hover:not(:disabled) {
        background: #f0ede6;
      }
      .opt-btn.active {
        border-color: var(--accent);
        background: var(--accent-light);
        color: var(--accent);
      }
      .opt-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .level-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .level-btn {
        width: 32px;
        height: 40px;
        border-radius: 6px;
        border: 1.5px solid var(--panel-border);
        background: #fafaf7;
        color: #546e7a;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
        touch-action: manipulation;
        padding: 0;
        position: relative;
      }
      .level-btn:hover {
        background: #f0ede6;
      }
      .level-btn.active {
        border-color: var(--accent);
        background: var(--accent-light);
        color: var(--accent);
      }
      .level-btn.recommended::after {
        content: "";
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--teal);
      }
      .level-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ===== Help ===== */
      .help-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
        color: #546e7a;
        line-height: 1.5;
      }
      .help-body .keys {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.6;
      }

      /* ===== Result overlay ===== */
      .result-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        animation: overlayFadeIn 0.3s ease;
        padding: 24px;
        text-align: center;
      }
      .overlay-emoji {
        font-size: 72px;
        animation: overlayPop 0.4s ease;
      }
      .overlay-msg {
        font-family: "Outfit", sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #0b171b;
        margin-top: 12px;
      }
      .overlay-sub {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        color: #0b171b;
        margin-top: 8px;
      }
      .overlay-hint {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        margin-top: 18px;
      }
      @keyframes overlayFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes overlayPop {
        0% {
          transform: scale(0.3);
        }
        70% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes markPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(0, 137, 123, 0.5);
        }
        100% {
          box-shadow: 0 0 0 8px rgba(0, 137, 123, 0);
        }
      }

      /* ===== Reduced motion ===== */
      @media (prefers-reduced-motion: reduce) {
        .result-overlay,
        .overlay-emoji,
        .pad-btn.fresh,
        .pad-dot.fresh,
        .board-clue.reveal,
        .solved-stamp {
          animation: none;
        }
        .lang-btn,
        .action-btn,
        .opt-btn,
        .level-btn,
        .code-slot,
        .symbol-btn,
        .clue-head,
        .pad-btn,
        .pad-dot,
        .pad-toggle,
        .stage-prompt {
          transition: none;
        }
      }

      /* ===== Mobile ===== */
      @media (max-width: 720px) {
        .main {
          height: auto;
          flex-direction: column;
        }
        .stage-wrap {
          border-right: none;
          border-bottom: 1px solid var(--panel-border);
        }
        .game-board {
          height: auto;
          display: flex;
          flex-direction: column;
          padding: 60px 12px 16px;
        }
        .clue-board {
          overflow-y: visible;
          grid-template-columns: 1fr;
          display: grid;
        }
        .board-actions {
          position: sticky;
          bottom: 0;
          background: var(--canvas-bg);
          padding: 8px 0;
          z-index: 6;
          width: 100%;
        }
        .symbol-tray {
          flex-wrap: nowrap;
          overflow-x: auto;
          justify-content: flex-start;
          padding-bottom: 4px;
          max-width: 100%;
        }
        .panel {
          width: 100%;
        }
      }
    </style>

            wellPlaced: wellPlaced,
            wrongPlaced: present - wellPlaced,

              clues.length >= cfg.minClues &&
