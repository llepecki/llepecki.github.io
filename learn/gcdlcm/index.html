          return text + flowSentence(rec, ev.row === 0 ? "splitA" : "splitB");
        }

        function shelfAnnouncement(rec, evType) {
          const s = shelfTiles(rec);
          return evType === "pair"
            ? T("shared") +
                ": " +
                joinTimes(s.shared) +
                ". " +
                flowSentence(rec, "pair")
            : T("result") +
                ": " +
                joinTimes(s.shared.concat(s.leftovers)) +
                ". " +
                flowSentence(rec, "leftovers");
        }

        function edgeLabel(rec, e) {
          if (e.answer === "yes" || e.answer === "no") {
            return T(e.answer);
          }
          return "";
        }

        // Arrows measured from the node boxes: straight edges in the gap
        // between neighbours, loops up the right gutter, the "No" bypass
        // around the pair node down the left gutter. The entry edge into the current node is drawn thick
        // and carries the round badge when it is a loop.
        function layoutChart() {
          const svg = dom.chartEdges;
          const rec = currentRecordForStage();
          if (!rec || dom.chart.hidden || svg.getClientRects().length === 0) {
            return;
          }
          const box = dom.chart.getBoundingClientRect();
          svg.setAttribute(
            "viewBox",
            "0 0 " + Math.max(1, box.width) + " " + Math.max(1, box.height),
          );
          svg.textContent = "";
          const defs = svgEl("defs", {});
          ["idle", "taken", "entry"].forEach((kind) => {
            // userSpaceOnUse: the default scales the head by the stroke
            // width, which gave the 3.5px entry edge a 24px arrowhead.
            const marker = svgEl("marker", {
              id: "arrow-" + kind,
              viewBox: "0 0 10 10",
              refX: 9,
              refY: 5,
              markerWidth: 11,
              markerHeight: 11,
              markerUnits: "userSpaceOnUse",
              orient: "auto",
            });
            marker.appendChild(
              svgEl("path", {
                d: "M0,0 L10,5 L0,10 z",
                class: "arrow-" + kind,
              }),
            );
            defs.appendChild(marker);
          });
          // Arrowhead for the round badge's loop icon, sized in user units.
          const badgeMarker = svgEl("marker", {
            id: "arrow-badge",
            viewBox: "0 0 10 10",
            refX: 8,
            refY: 5,
            markerWidth: 7,
            markerHeight: 7,
            markerUnits: "userSpaceOnUse",
            orient: "auto",
          });
          badgeMarker.appendChild(
            svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "arrow-taken" }),
          );
          defs.appendChild(badgeMarker);
          svg.appendChild(defs);
          const rects = {};
          flowNodesFor(rec.algorithm).forEach((id) => {
            const node = dom.chartList.querySelector(
              '[data-node="' + id + '"]',
            );
            const r = node.getBoundingClientRect();
            rects[id] = {
              l: r.left - box.left,
              r: r.right - box.left,
              t: r.top - box.top,
              b: r.bottom - box.top,
              cx: r.left + r.width / 2 - box.left,
              cy: r.top + r.height / 2 - box.top,
            };
          });
          const laneR = rects.splitA.r + 24;
          const laneL = rects.splitA.l - 24;
          const info = flowNode(rec);
          const text = (x, y, anchor, cls, content) => {
            const t = svgEl("text", {
              x,
              y,
              "text-anchor": anchor,
              class: "edge-label" + (cls ? " " + cls : ""),
            });
            t.textContent = content;
            svg.appendChild(t);
          };
          // An elbow with rounded corners: out to a lane, along it, back in.
          const elbow = (x1, y1, lane, y2, x2) => {
            const r = 10;
            const sx = lane > x1 ? 1 : -1;
            const sy = y2 > y1 ? 1 : -1;
            return (
              "M" +
              x1 +
              "," +
              y1 +
              " H" +
              (lane - sx * r) +
              " Q" +
              lane +
              "," +
              y1 +
              " " +
              lane +
              "," +
              (y1 + sy * r) +
              " V" +
              (y2 - sy * r) +
              " Q" +
              lane +
              "," +
              y2 +
              " " +
              (lane - sx * r) +
              "," +
              y2 +
              " H" +
              x2
            );
          };
          flowEdges(rec).forEach((e) => {
            const a = rects[e.from];
            const b = rects[e.to];
            const kind = e.entry ? "entry" : e.taken ? "taken" : "idle";
            const label = edgeLabel(rec, e);
            const labelCls = e.taken || e.entry ? "taken" : "";
            let d;
            if (e.loop) {
              d = elbow(a.r, a.cy, laneR, b.cy, b.r + 1);
              if (label !== "") {
                text(laneR + 5, a.cy + 5, "start", labelCls, label);
              }
              if (e.entry && info.round > 1) {
                // Round badge: a small anticlockwise loop icon, drawn rather
                // than the ↺ glyph (missing from the served mono subset),
                // then the round number.
                const cx = laneR + 12;
                const r = 6;
                svg.appendChild(
                  svgEl("path", {
                    d:
                      "M" +
                      (cx - 0.866 * r) +
                      "," +
                      (b.cy - 0.5 * r) +
                      " A" +
                      r +
                      "," +
                      r +
                      " 0 1 0 " +
                      cx +
                      "," +
                      (b.cy - r),
                    class: "badge-loop",
                    "marker-end": "url(#arrow-badge)",
                  }),
                );
                text(
                  laneR + 23,
                  b.cy + 5,
                  "start",
                  "taken badge",
                  String(info.round),
                );
              }
            } else if (
              FLOW_NODES.indexOf(e.to) - FLOW_NODES.indexOf(e.from) >
              1
            ) {
              // "No" skips the pair node: down the left gutter.
              d = elbow(a.l, a.cy, laneL, b.cy, b.l - 1);
              if (label !== "") {
                text(laneL - 5, a.cy + 5, "end", labelCls, label);
              }
            } else {
              d = "M" + a.cx + "," + a.b + " V" + (b.t - 1);
              if (label !== "") {
                text(a.cx + 12, (a.b + b.t) / 2 + 5, "start", labelCls, label);
              }
            }
            svg.appendChild(
              svgEl("path", {
                d,
                class: "edge " + kind,
                "marker-end": "url(#arrow-" + kind + ")",
              }),
            );
          });
        }

        function renderStage() {
          const bench = dom.workbench;
          bench.textContent = "";
          const rec = currentRecordForStage();
          if (state.screen === "choice") {
            dom.chart.hidden = true;
            dom.chartToggle.hidden = true;
            dom.stage.classList.add("no-chart");
            // The panel heading carries the prompt; the cards are the buttons.
            dom.stageCue.hidden = true;
            bench.appendChild(buildStageCards());
            return;
          }
          if (isPickerView()) {
            dom.chart.hidden = true;
            dom.chartToggle.hidden = true;
            dom.stage.classList.add("no-chart");
            dom.stageCue.hidden = false;
            dom.stageCue.className = "stage-cue";
            dom.stageCue.textContent = T("customPrompt");
            bench.appendChild(buildPicker());
            return;
          }
          if (!rec) {
            dom.chart.hidden = true;
            dom.chartToggle.hidden = true;
            dom.stage.classList.add("no-chart");
            dom.stageCue.hidden = true;
            return;
          }
          const phase = derivePhase(rec);
          const tut = state.tutorial;
          const inTutorial = rec.experience === "tutorial";
          const scene1 = inTutorial && state.tutorial.scene === 1;
          const ctx = {
            interactive: !inTutorial || !tut.demoRunning,
            demoRunning: scene1 && tut.demoRunning,
            hint: rec.hintTier >= 2 ? hintTarget(rec) : null,
            primes: scene1 && !tut.childSplit ? [2] : null,
            // A summary shows the last solved board without a next action.
            summary:
              state.screen === "practice" && currentRun().activeIndex === null,
          };
          renderChart(rec);
          // The tutorial's panel prompt is the instruction there.
          const cue = inTutorial ? "" : cueSentence(rec);
          dom.stageCue.hidden = cue === "";
          dom.stageCue.textContent = cue;
          dom.stageCue.className =
            "stage-cue" + (phase === "assemble" ? " active" : "");

          const svg = svgEl("svg", {
            class: "connectors",
            id: "connectors",
            "aria-hidden": "true",
          });
          bench.appendChild(svg);
          bench.appendChild(buildRail(rec, 0, ctx));
          bench.appendChild(buildRail(rec, 1, ctx));
          if (phase === "split") {
            bench.appendChild(buildPrimeRow(rec, ctx));
            return;
          }
          const s = shelfTiles(rec);
          const lit = litZone(rec, ctx);
          bench.appendChild(
            buildShelf(
              "shared",
              s.shared,
              showNoSharedMessage(rec) ? "noShared" : null,
              lit === "shared",
            ),
          );
          if (rec.algorithm === "lcm") {
            bench.appendChild(
              buildShelf("leftovers", s.leftovers, null, lit === "leftovers"),
            );
          }
          bench.appendChild(buildResultShelf(rec, ctx));
          if (phase === "assemble" && rec.choices) {
            bench.appendChild(buildChoices(rec));
          }
          if (phase === "result") {
            bench.appendChild(buildProof(rec));
          }
        }

        // ==========================================================
        // Panel rendering
        // ==========================================================
        function setFeedback(rec) {
          const fb = dom.feedback;
          fb.className = "feedback";
          if (!rec) {
            fb.hidden = true;
            fb.textContent = "";
            return;
          }
          if (derivePhase(rec) === "result" && rec.experience !== "tutorial") {
            fb.hidden = false;
            fb.classList.add("success");
            fb.textContent =
              rec.experience === "challenge"
                ? T(rec.independent ? "independentOne" : "withHelp")
                : T("solvedPair");
            return;
          }
          if (!rec.feedback) {
            fb.hidden = true;
            fb.textContent = "";
            return;
          }
          fb.hidden = false;
          fb.classList.add(rec.feedback.tone);
          fb.textContent = msgText(rec.feedback);
        }

        function renderPracticePanel() {
          const run = currentRun();
          const view = practiceView();
          const rec = view.view === "task" ? view.record : null;
          dom.taskTerm.textContent = algorithmName(state.algorithm);
          const picker = isPickerView();
          const summary = view.view === "summary" && !picker;
          dom.taskActions.hidden = summary || picker;
          dom.resetBtn.hidden = summary || picker;
          dom.summaryActions.hidden = !summary;
          dom.stepBtn.hidden = summary || !rec || rec.hintTier !== 3;
          if (picker) {
            dom.taskText.textContent = T("customPrompt");
            setFeedback(null);
          } else if (summary) {
            dom.taskText.textContent =
              state.experience === "guided"
                ? fmt(T("progress"), {
                    done: completedCount(run),
                    total: run.size,
                  })
                : fmt(T("independent"), { count: independentCount(run) });
            setFeedback(null);
            dom.summaryPrimary.textContent = T(
              state.experience === "guided" ? "practiceAgain" : "tryAgain",
            );
            dom.summarySecondary.textContent = T(
              state.experience === "guided" ? "tryChallenge" : "guided",
            );
          } else if (rec) {
            dom.taskText.textContent = taskSentence(rec);
            setFeedback(rec);
            const phase = derivePhase(rec);
            // At tier 3 Hint would only repeat its tier-2 sentence, and the
            // help it unlocked is already on screen as Show one step.
            dom.hintBtn.disabled = phase === "result" || rec.hintTier === 3;
            dom.undoBtn.disabled = !canUndo(rec);
          }
          // The count rides with the task sentence. Your numbers keeps no
          // count, and a summary already states it as the heading.
          dom.progressText.hidden =
            state.experience === "custom" || summary || picker;
          dom.progressText.textContent = fmt(T("progress"), {
            done: solvedCount(run),
            total: run.size,
          });
          dom.expCustom.classList.toggle(
            "active",
            state.experience === "custom",
          );
          dom.expCustom.setAttribute(
            "aria-pressed",
            state.experience === "custom" ? "true" : "false",
          );
          dom.expGuided.classList.toggle(
            "active",
            state.experience === "guided",
          );
          dom.expGuided.setAttribute(
            "aria-pressed",
            state.experience === "guided" ? "true" : "false",
          );
          dom.expChallenge.classList.toggle(
            "active",
            state.experience === "challenge",
          );
          dom.expChallenge.setAttribute(
            "aria-pressed",
            state.experience === "challenge" ? "true" : "false",
          );
          dom.moreBtn.setAttribute(
            "aria-expanded",
            state.moreOpen ? "true" : "false",
          );
          dom.moreBody.hidden = !state.moreOpen;
        }

        function tutorialLines() {
          const tut = state.tutorial;
          const rec = tut.records[tut.scene - 1];
          if (tut.scene === 1) {
            if (!tut.childSplit) {
              return ["factorIntro"];
            }
            if (tut.demoRunning) {
              return ["stepSplitInfo"];
            }
            if (!rec.solved) {
              return ["primeIntro", "stepMatchInfo", "gcdTutorialPair"];
            }
            return ["gcdTutorialEnd"];
          }
          if (rec.pairs.length === 0) {
            return ["primeIntro", "lcmTutorialPair"];
          }
          if (!rec.solved) {
            return ["lcmRule", "lcmTutorialAdd"];
          }
          return ["lcmTutorialEnd"];
        }

        // §7 lets the tutorial split an exact string at its sentence boundary
        // into a 17px concept line and a 28px immediate-action line.
        const TUTORIAL_PROMPT_KEYS = ["gcdTutorialPair", "lcmTutorialPair"];
        const TUTORIAL_SPLIT_KEYS = ["factorIntro", "lcmTutorialAdd"];
        function tutorialTiers(key, vars) {
          const text = fmt(T(key), vars);
          if (TUTORIAL_PROMPT_KEYS.indexOf(key) !== -1) {
            return [{ text, prompt: true }];
          }
          const cut = text.indexOf(". ");
          if (TUTORIAL_SPLIT_KEYS.indexOf(key) === -1 || cut === -1) {
            return [{ text, prompt: false }];
          }
          return [
            { text: text.slice(0, cut + 1), prompt: false },
            { text: text.slice(cut + 2), prompt: true },
          ];
        }

        function renderIntroPanel() {
          const tut = state.tutorial;
          const choice = state.screen === "choice";
          dom.introTitle.classList.toggle("prompt", choice);
          dom.introLines.textContent = "";
          dom.introNav.hidden = choice;
          dom.introSkip.hidden = choice;
          dom.introReplay.hidden = !choice;
          if (choice) {
            dom.introTitle.textContent = T("choose");
            return;
          }
          const rec = tut.records[tut.scene - 1];
          dom.introTitle.textContent = algorithmName(
            tut.scene === 1 ? "gcd" : "lcm",
          );
          const vars = { n: activeRow(rec) === 1 ? rec.b : rec.a };
          tutorialLines().forEach((key) => {
            tutorialTiers(key, vars).forEach((tier) =>
              dom.introLines.appendChild(
                el("p", tier.prompt ? "prompt" : "", tier.text),
              ),
            );
          });
          dom.introCounter.textContent = tut.scene + " / 2";
          dom.introPrev.disabled = tut.scene === 1;
          dom.introNext.disabled = !rec.solved || tut.demoRunning;
        }

        function applyFocus() {
          const req = state.focusReq;
          state.focusReq = null;
          if (!req) {
            return;
          }
          let node = null;
          if (req.type === "prime") {
            node = dom.workbench.querySelector('[data-prime="' + req.p + '"]');
          } else if (req.type === "tile") {
            node = dom.workbench.querySelector(
              '[data-tile-id="' + req.id + '"]',
            );
          } else if (req.type === "choice") {
            node = dom.workbench.querySelector(
              '[data-choice="' + req.value + '"]',
            );
          } else if (req.type === "primary") {
            node = $("primaryBtn");
          } else if (req.type === "quot") {
            node = dom.workbench.querySelector(
              '.quot-circle[data-row="' + (req.row === 0 ? "A" : "B") + '"]',
            );
          } else if (req.type === "pick") {
            node = dom.workbench.querySelector('[data-pick="' + req.key + '"]');
          } else if (req.type === "taskHeading") {
            node =
              practiceView().view === "summary" && !isPickerView()
                ? dom.summaryPrimary
                : dom.taskText;
          } else if (req.type === "introHeading") {
            node = dom.introTitle;
          } else if (req.type === "introNext") {
            node = dom.introNext;
          } else if (req.type === "summaryPrimary") {
            node = dom.summaryPrimary;
          } else if (req.type === "hint") {
            node = dom.hintBtn;
          } else if (req.type === "chartToggle") {
            node = dom.chartToggle;
          }
          if (!node || node.disabled || node.tagName === "SPAN") {
            const rec = currentRecordForStage();
            const fallback = rec ? defaultFocus(rec) : null;
            if (
              fallback &&
              (fallback.type !== req.type ||
                fallback.id !== req.id ||
                fallback.p !== req.p)
            ) {
              state.focusReq = fallback;
              applyFocus();
            }
            return;
          }
          node.focus();
        }

        function render() {
          cancelDrag(true);
          const intro = state.screen !== "practice";
          dom.main.classList.toggle("intro-mode", intro);
          if (intro) {
            renderIntroPanel();
          } else {
            renderPracticePanel();
          }
          renderStage();
          layoutProof();
          layoutConnectors();
          layoutChart();
          applyFocus();
          state.popTile = null;
          state.revealProof = false;
        }

        function applyTranslations() {
          document.title = T("title");
          document.documentElement.lang = state.lang;
          dom.titleText.textContent = T("title");
          dom.subtitleText.textContent = T("subtitle");
          dom.langBtn.textContent = state.lang === "en" ? "PL" : "EN";
          labelControl(dom.langBtn, T("switchLanguage"));
          labelControl(dom.homeLink, T("backToLearn"));
          dom.stage.setAttribute("aria-label", T("stageLabel"));
          dom.chartList.setAttribute("aria-label", T("steps"));
          dom.moreBtn.textContent = T("more");
          dom.introPrev.textContent = T("previous");
          dom.introNext.textContent = T("next");
          dom.introSkip.textContent = T("skip");
          dom.introReplay.textContent = T("replay");
          dom.hintBtn.textContent = T("hint");
          dom.undoBtn.textContent = T("undo");
          dom.stepBtn.textContent = T("showStep");
          dom.resetBtn.textContent = T("reset");
          dom.expGuided.textContent = T("guided");
          dom.expChallenge.textContent = T("challenge");
          dom.expCustom.textContent = T("custom");
          dom.switchAlgBtn.textContent = T("switchAlgorithm");
          dom.replayBtn.textContent = T("replay");
        }

        // ==========================================================
        // Tutorial flow
        // ==========================================================
        function ensureTutorialRecords() {
          const tut = state.tutorial;
          if (!tut.records[0]) {
            tut.records[0] = makeRecord({
              algorithm: "gcd",
              experience: "tutorial",
              taskIndex: 0,
              a: 12,
              b: 18,
            });
          }
          if (!tut.records[1]) {
            tut.records[1] = makeRecord({
              algorithm: "lcm",
              experience: "tutorial",
              taskIndex: 0,
              a: 4,
              b: 6,
              preSplit: true,
            });
          }
        }

        function demoStep() {
          const tut = state.tutorial;
          const rec = tut.records[0];
          if (activeRow(rec) < 0) {
            finishDemo();
            state.focusReq = defaultFocus(rec);
            render();
            return;
          }
          const ev = applySplit(rec, validPrimes(rec)[0], true);
          state.popTile = ev.tileId;
          render();
          tut.demoTimer = setTimeout(demoStep, 450);
        }

        function finishDemo() {
          const tut = state.tutorial;
          const rec = tut.records[0];
          if (tut.demoTimer) {
            clearTimeout(tut.demoTimer);
            tut.demoTimer = null;
          }
          while (activeRow(rec) >= 0) {
            applySplit(rec, validPrimes(rec)[0], true);
          }
          rec.history = [];
          tut.demoRunning = false;
          // The demo announces once, as the two finished rows and the chart.
          announce(
            [0, 1]
              .map((row) => {
                const inv = splitInvariant(rec, row);
                return inv.orig + " = " + joinTimes(inv.terms) + ".";
              })
              .join(" ") +
              " " +
              flowSentence(rec, "splitB"),
          );
        }

        function startDemo() {
          const tut = state.tutorial;
          const rec = tut.records[0];
          tut.childSplit = true;
          tut.demoRunning = true;
          if (state.reduceMotion) {
            finishDemo();
            state.focusReq = defaultFocus(rec);
            render();
            return;
          }
          state.focusReq = { type: "introHeading" };
          render();
          tut.demoTimer = setTimeout(demoStep, 450);
        }

        function markIntroSeen() {
          try {
            localStorage.setItem(INTRO_KEY, "1");
          } catch {
            /* storage unavailable: the tutorial simply reopens next visit */
          }
        }

        function introSeen() {
          try {
            return localStorage.getItem(INTRO_KEY) === "1";
          } catch {
            return false;
          }
        }

        function openTutorial(scene) {
          ensureTutorialRecords();
          state.screen = "tutorial";
          state.tutorial.scene = scene;
          state.focusReq = { type: "introHeading" };
          render();
        }

        function openChoice() {
          if (state.tutorial.demoRunning) {
            finishDemo();
          }
          markIntroSeen();
          state.screen = "choice";
          state.focusReq = { type: "introHeading" };
          render();
        }

        function replayTutorial() {
          const tut = state.tutorial;
          if (tut.demoTimer) {
            clearTimeout(tut.demoTimer);
            tut.demoTimer = null;
          }
          tut.records = [null, null];
          tut.childSplit = false;
          tut.demoRunning = false;
          openTutorial(1);
        }

        // ==========================================================
        // Practice flow
        // ==========================================================
        function announceTask(rec) {
          announce(taskSentence(rec) + " " + cueSentence(rec));
        }

        function openExperience(algorithm, experience, reason) {
          if (state.tutorial.demoRunning) {
            finishDemo();
          }
          state.screen = "practice";
          state.algorithm = algorithm;
          state.experience = experience;
          const run = currentRun();
          const view = openRun(run, algorithm, experience);
          if (view.fresh) {
            announceTask(view.record);
          }
          if (view.view === "summary") {
            state.focusReq = {
              type: isPickerView() ? "taskHeading" : "summaryPrimary",
            };
          } else if (reason === "switch") {
            state.focusReq = { type: "taskHeading" };
          } else {
            state.focusReq = defaultFocus(view.record);
          }
          render();
        }

        function setRecordFeedback(rec, ev, tone) {
          rec.feedback =
            ev && ev.key ? { key: ev.key, vars: ev.vars || {}, tone } : null;
          if (rec.feedback) {
            announce(msgText(rec.feedback));
          }
        }

        function afterCommit(rec) {
          state.pendingPrime = null;
          rec.hintTier = 0;
          rec.feedback = null;
        }

        function tutorialAutoReveal(rec) {
          if (
            rec.experience === "tutorial" &&
            derivePhase(rec) === "assemble" &&
            isCompleteShelf(rec)
          ) {
            checkResult(rec);
            state.revealProof = true;
            announce(
              T("result") +
                ": " +
                shelfProduct(rec) +
                ". " +
                proofSentence(rec),
            );
            state.focusReq = { type: "introNext" };
            return true;
          }
          return false;
        }

        // ==========================================================
        // Handlers
        // ==========================================================
        // A tap selects the prime; the split happens when the child touches
        // the number itself, so tapping connects to the board the way
        // dragging does. Drag remains the primary path.
        function onPrimeClick(p) {
          const rec = currentRecord();
          if (
            !rec ||
            (rec.experience === "tutorial" && state.tutorial.demoRunning)
          ) {
            return;
          }
          state.pendingPrime = state.pendingPrime === p ? null : p;
          state.focusReq =
            state.pendingPrime === null
              ? { type: "prime", p }
              : { type: "quot", row: activeRow(rec) };
          render();
        }

        function onQuotClick(row) {
          const rec = currentRecord();
          const p = state.pendingPrime;
          if (!rec || p === null || activeRow(rec) !== row) {
            return;
          }
          applySplitEvent(rec, applySplit(rec, p, false), p);
        }

        // Tap and drop share the outcome handling: invalid feedback, the
        // tutorial demo hand-off, and the keep-focus-on-the-prime rule.
        function applySplitEvent(rec, ev, p) {
          if (ev.type === "invalid") {
            setRecordFeedback(rec, ev, "error");
            state.pendingPrime = null;
            state.focusReq = { type: "prime", p };
            render();
            flashWrong(dom.workbench.querySelector('[data-prime="' + p + '"]'));
            return;
          }
          if (ev.type !== "split") {
            return;
          }
          afterCommit(rec);
          state.popTile = ev.tileId;
          announce(splitAnnouncement(rec, ev));
          if (rec.experience === "tutorial" && !state.tutorial.childSplit) {
            startDemo();
            return;
          }
          state.focusReq =
            validPrimes(rec).indexOf(p) >= 0
              ? { type: "prime", p }
              : defaultFocus(rec);
          render();
        }

        // Tap and drag results go through the same handler, so feedback,
        // announcements, focus and the tutorial reveal cannot diverge.
        function applyTileEvent(rec, ev) {
          if (ev.type === "noop" || ev.type === "cancel") {
            return;
          }
          if (ev.type === "invalid") {
            setRecordFeedback(rec, ev, "error");
            state.focusReq = { type: "tile", id: ev.tileId };
            render();
            flashWrong(
              dom.workbench.querySelector('[data-tile-id="' + ev.tileId + '"]'),
            );
            return;
          }
          if (ev.type === "select") {
            rec.feedback = null;
            state.focusReq = defaultFocus(rec);
            render();
            return;
          }
          if (ev.type === "deselect") {
            rec.feedback = null;
            state.focusReq = { type: "tile", id: ev.tileId };
            render();
            return;
          }
          afterCommit(rec);
          announce(shelfAnnouncement(rec, ev.type));
          state.focusReq = defaultFocus(rec);
          tutorialAutoReveal(rec);
          render();
        }

        function onTileClick(id) {
          const rec = currentRecord();
          if (!rec) {
            return;
          }
          applyTileEvent(rec, selectTile(rec, id));
        }

        // ==========================================================
        // Drag (Pointer Events). One primary pointer, pointer capture on
        // the source tile, an 8px threshold before anything visual, and the
        // drop resolved by pointer coordinates. The rules layer decides.
        // ==========================================================
        const DRAG_THRESHOLD = 8;
        const DROP_HALO = 8;
        const GHOST_HALF = 26;
        const CLICK_GUARD_MS = 1000;
        let drag = null;
        // The synthetic click that follows a moved drag is swallowed only when
        // it lands on that gesture's source tile, so unrelated clicks pass.
        let clickGuard = null;

        function dragMode(rec, tile) {
          if (derivePhase(rec) !== "assemble" || tile.pair !== null) {
            return null;
          }
          if (hasPossiblePair(rec)) {
            return isMatchable(rec, tile) ? "pair" : null;
          }
          return rec.algorithm === "lcm" && !tile.added ? "leftover" : null;
        }

        function tileNode(id) {
          return dom.workbench.querySelector('[data-tile-id="' + id + '"]');
        }

        function shelfNode(key) {
          return dom.workbench.querySelector('[data-shelf="' + key + '"]');
        }

        function onTilePointerDown(e, tile, mode) {
          if (!e.isPrimary || e.button !== 0) {
            return;
          }
          if (drag) {
            // A retained record belongs to a pointer that is still down. Another
            // pointer must not take it over; the same pointer pressing again
            // means its release was never delivered, so start afresh.
            if (!drag.cancelled || drag.pointerId !== e.pointerId) {
              return;
            }
            drag = null;
          }
          const rec = currentRecord();
          if (!rec) {
            return;
          }
          clickGuard = null;
          drag = {
            pointerId: e.pointerId,
            sourceId: tile.id,
            row: tile.row,
            p: tile.p,
            mode,
            node: e.currentTarget,
            startX: e.clientX,
            startY: e.clientY,
            moved: false,
            cancelled: false,
            ghost: null,
            hover: null,
            pendingId: rec.pending,
          };
          try {
            e.currentTarget.setPointerCapture(e.pointerId);
          } catch {
            // Capture is best effort; document listeners still finish the gesture.
          }
        }

        function onPointerMove(e) {
          if (!drag || e.pointerId !== drag.pointerId || drag.cancelled) {
            return;
          }
          if (!drag.moved) {
            const dx = e.clientX - drag.startX;
            const dy = e.clientY - drag.startY;
            if (dx * dx + dy * dy < DRAG_THRESHOLD * DRAG_THRESHOLD) {
              return;
            }
            startVisualDrag();
          }
          moveGhost(e.clientX, e.clientY);
          setHover(hitTarget(e.clientX, e.clientY));
        }

        function startVisualDrag() {
          drag.moved = true;
          document.body.classList.add("is-dragging");
          drag.node.classList.add("drag-source");
          if (drag.pendingId !== null) {
            // The tap selection is suspended, not cleared; a cancel restores it.
            const pending = tileNode(drag.pendingId);
            if (pending) {
              pending.classList.remove("selected");
            }
          }
          legalTargets().forEach((n) => n.classList.add("drop-target"));
          const ghost = el("div", "drag-ghost", String(drag.p));
          ghost.setAttribute("aria-hidden", "true");
          document.body.appendChild(ghost);
          drag.ghost = ghost;
          moveGhost(drag.startX, drag.startY);
        }

        function legalTargets() {
          const rec = currentRecord();
          if (!rec) {
            return [];
          }
          if (drag.mode === "prime") {
            // Only the active row's circle is a button, so this finds one
            // element or none.
            const circle = dom.workbench.querySelector("button.quot-circle");
            return circle ? [circle] : [];
          }
          if (drag.mode === "leftover") {
            const shelf = shelfNode("leftovers");
            return shelf ? [shelf] : [];
          }
          const targets = unpairedTiles(rec, 1 - drag.row)
            .filter((t) => t.p === drag.p)
            .map((t) => tileNode(t.id))
            .filter(Boolean);
          const shared = shelfNode("shared");
          if (shared) {
            targets.push(shared);
          }
          return targets;
        }

        function placeGhost(ghost, x, y) {
          ghost.style.transform =
            "translate(" + (x - GHOST_HALF) + "px, " + (y - GHOST_HALF) + "px)";
        }

        function moveGhost(x, y) {
          if (drag.ghost) {
            placeGhost(drag.ghost, x, y);
          }
        }

        function within(r, x, y, halo) {
          return (
            x >= r.left - halo &&
            x <= r.right + halo &&
            y >= r.top - halo &&
            y <= r.bottom + halo
          );
        }

        // Every opposite-row unpaired tile is a candidate (a wrong prime must
        // still explain itself); overlapping halos resolve to the nearest centre.
        function hitTarget(x, y) {
          const rec = currentRecord();
          if (!rec) {
            return null;
          }
          if (drag.mode === "prime") {
            // A prime is dropped onto the part still to be broken down. Both
            // rows show one, and dropOnPrime cancels for the inactive row.
            const circle = Array.from(
              dom.workbench.querySelectorAll(".quot-circle"),
            ).find((n) => within(n.getBoundingClientRect(), x, y, DROP_HALO));
            return circle
              ? {
                  node: circle,
                  row: circle.getAttribute("data-row") === "A" ? 0 : 1,
                }
              : null;
          }
          if (drag.mode === "leftover") {
            const shelf = shelfNode("leftovers");
            return shelf && within(shelf.getBoundingClientRect(), x, y, 0)
              ? { node: shelf, shelf: true }
              : null;
          }
          let best = null;
          let bestDist = Infinity;
          unpairedTiles(rec, 1 - drag.row).forEach((t) => {
            const node = tileNode(t.id);
            if (!node) {
              return;
            }
            const r = node.getBoundingClientRect();
            if (!within(r, x, y, DROP_HALO)) {
              return;
            }
            const d = Math.hypot(
              x - (r.left + r.width / 2),
              y - (r.top + r.height / 2),
            );
            if (d < bestDist) {
              bestDist = d;
              best = { node, tileId: t.id };
            }
          });
          if (best) {
            return best;
          }
          const shared = shelfNode("shared");
          return shared && within(shared.getBoundingClientRect(), x, y, 0)
            ? { node: shared, shelf: true }
            : null;
        }

        // While a prime hovers the number it would divide, show the outcome
        // faintly in place: the prime as a factor circle, then what would be
        // left beside it. Ghosted, so it reads as "this is what will happen"
        // rather than as work already done.
        let splitPreview = null;

        function clearSplitPreview() {
          if (!splitPreview) {
            return;
          }
          splitPreview.node.textContent = splitPreview.was;
          splitPreview.node.classList.remove("preview", "as-prime");
          splitPreview.times.remove();
          splitPreview.rest.remove();
          splitPreview = null;
        }

        function showSplitPreview(node) {
          const rec = currentRecord();
          if (
            !rec ||
            !drag ||
            drag.mode !== "prime" ||
            !node.classList.contains("quot-circle")
          ) {
            return;
          }
          const row = node.getAttribute("data-row") === "A" ? 0 : 1;
          const q = rec.quotients[row];
          if (activeRow(rec) !== row || q % drag.p !== 0) {
            return;
          }
          const times = document.createTextNode(" × ");
          const rest = el("span", "quot-circle preview", String(q / drag.p));
          rest.setAttribute("aria-hidden", "true");
          node.parentNode.insertBefore(times, node.nextSibling);
          node.parentNode.insertBefore(rest, times.nextSibling);
          splitPreview = { node, was: node.textContent, times, rest };
          node.textContent = String(drag.p);
          node.classList.add("preview", "as-prime");
        }

        function setHover(hit) {
          const node = hit ? hit.node : null;
          if (drag.hover === node) {
            return;
          }
          if (drag.hover) {
            drag.hover.classList.remove("drop-hover");
            clearSplitPreview();
          }
          if (node) {
            node.classList.add("drop-hover");
            showSplitPreview(node);
          }
          drag.hover = node;
        }

        // Removes the drag chrome; the ghost settles onto `snapTo` (target on
        // a valid drop, source on a cancel) in 0.2s, or at once under reduced motion.
        function clearDragVisuals(d, snapTo) {
          document.body.classList.remove("is-dragging");
          dom.workbench
            .querySelectorAll(".drop-target, .drop-hover")
            .forEach((n) => n.classList.remove("drop-target", "drop-hover"));
          d.node.classList.remove("drag-source");
          const ghost = d.ghost;
          d.ghost = null;
          if (!ghost) {
            return;
          }
          if (state.reduceMotion || !snapTo || !snapTo.isConnected) {
            ghost.remove();
            return;
          }
          const r = snapTo.getBoundingClientRect();
          ghost.classList.add("settle");
          placeGhost(ghost, r.left + r.width / 2, r.top + r.height / 2);
          setTimeout(() => ghost.remove(), 220);
        }

        function restorePendingVisual(d) {
          if (d.pendingId === null) {
            return;
          }
          const pending = tileNode(d.pendingId);
          if (pending) {
            pending.classList.add("selected");
          }
        }

        // keepRecord: the pointer is still down (Escape, rerender), so the
        // record stays until pointerup swallows the synthetic click.
        function cancelDrag(keepRecord) {
          if (!drag || drag.cancelled) {
            return;
          }
          clearSplitPreview();
          if (drag.moved) {
            clearDragVisuals(drag, drag.node);
            restorePendingVisual(drag);
          }
          if (keepRecord && drag.moved) {
            drag.cancelled = true;
          } else {
            drag = null;
          }
        }

        function armClickSwallow(node) {
          clickGuard = { node, until: Date.now() + CLICK_GUARD_MS };
        }

        function onPointerUp(e) {
          if (!drag || e.pointerId !== drag.pointerId) {
            return;
          }
          const d = drag;
          if (!d.moved) {
            drag = null;
            return; // a plain tap: the click event does the work
          }
          armClickSwallow(d.node);
          if (d.cancelled) {
            drag = null;
            return;
          }
          const hit = hitTarget(e.clientX, e.clientY);
          const rec = currentRecord();
          let ev = CANCEL;
          if (rec && hit) {
            if (d.mode === "prime") {
              ev = dropPrime(rec, d.p, hit.row);
            } else if (d.mode === "leftover") {
              ev = dropLeftover(rec, d.sourceId);
            } else if (hit.shelf) {
              ev = dropOnShared(rec, d.sourceId);
            } else {
              ev = dropTile(rec, d.sourceId, hit.tileId);
            }
          }
          clearSplitPreview();
          const committed =
            ev.type === "pair" || ev.type === "leftover" || ev.type === "split";
          clearDragVisuals(d, committed ? hit.node : d.node);
          drag = null;
          if (ev.type === "cancel") {
            restorePendingVisual(d);
            // Dropped on a real zone that turned it down, not on empty space.
            if (hit) {
              flashWrong(hit.node);
            }
            return;
          }
          if (d.mode === "prime") {
            applySplitEvent(rec, ev, d.p);
          } else {
            applyTileEvent(rec, ev);
          }
        }

        function onPointerCancel(e) {
          if (!drag || e.pointerId !== drag.pointerId) {
            return;
          }
          if (drag.cancelled) {
            drag = null; // the pointer is gone; no click will follow
            return;
          }
          cancelDrag(false);
        }

        function onLostCapture(e) {
          if (drag && e.pointerId === drag.pointerId && !drag.cancelled) {
            cancelDrag(true);
          }
        }

        function swallowSyntheticClick(e) {
          if (!clickGuard) {
            return;
          }
          const guard = clickGuard;
          if (Date.now() > guard.until) {
            clickGuard = null;
            return;
          }
          if (guard.node === e.target || guard.node.contains(e.target)) {
            clickGuard = null;
            e.stopPropagation();
            e.preventDefault();
          }
        }

        function onChoiceClick(value) {
          const rec = currentRecord();
          if (!rec) {
            return;
          }
          chooseAnswer(rec, value);
          state.focusReq = { type: "choice", value };
          render();
        }

        function onPrimaryAction() {
          const rec = currentRecord();
          if (!rec) {
            return;
          }
          const ev =
            rec.experience === "challenge"
              ? submitAnswer(rec)
              : checkResult(rec);
          if (ev.type === "solved") {
            rec.feedback = null;
            rec.hintTier = 0;
            state.revealProof = true;
            announce(T("result") + ": " + ev.value + ". " + proofSentence(rec));
            state.focusReq = { type: "primary" };
            render();
            return;
          }
          if (ev.type !== "noop") {
            setRecordFeedback(rec, ev, "error");
          }
          state.focusReq = { type: "primary" };
          render();
          if (ev.type === "wrong") {
            flashWrong(
              dom.workbench.querySelector('[data-choice="' + rec.choice + '"]'),
            );
          } else if (ev.type !== "noop") {
            flashWrong($("primaryBtn"));
          }
        }

        function onNextTask() {
          const run = currentRun();
          if (!finishActive(run)) {
            return;
          }
          openExperience(state.algorithm, state.experience, "next");
        }

        function onHint() {
          const rec = currentRecord();
          if (!rec) {
            return;
          }
          const ev = pressHint(rec);
          if (ev.type === "noop") {
            return;
          }
          setRecordFeedback(rec, ev, "info");
          state.focusReq = { type: "hint" };
          render();
        }

        function onShowStep() {
          const rec = currentRecord();
          if (!rec) {
            return;
          }
          const ev = applyHintStep(rec);
          if (ev.type === "noop") {
            render();
            return;
          }
          afterCommit(rec);
          if (ev.type === "split") {
            state.popTile = ev.tileId;
            announce(splitAnnouncement(rec, ev));
          } else {
            announce(shelfAnnouncement(rec, ev.type));
          }
          state.focusReq = defaultFocus(rec);
          render();
        }

        function onUndo() {
          const rec = currentRecord();
          if (!rec) {
            return;
          }
          const ev = undo(rec);
          if (ev.type === "noop") {
            return;
          }
          rec.feedback = null;
          announce(
            T(NODE_LABEL_KEYS[flowNode(rec).node]) + ". " + cueSentence(rec),
          );
          // Undo stays the focused control while it can still undo something;
          // once it disables, focus moves to the logical next action.
          state.focusReq = canUndo(rec) ? null : defaultFocus(rec);
          render();
        }

        function onReset() {
          const run = currentRun();
          const rec = resetActive(run);
          if (!rec) {
            return;
          }
          announceTask(rec);
          state.focusReq = defaultFocus(rec);
          render();
        }

        function onPickNumber(row, n) {
          const run = currentRun();
          run.pick[row] = run.pick[row] === n ? null : n;
          state.focusReq = { type: "pick", key: row + n };
          render();
        }

        function onPickStart() {
          const run = currentRun();
          const pick = run.pick;
          if (
            pick.a === null ||
            pick.b === null ||
            !proofFits(state.algorithm, pick.a, pick.b)
          ) {
            return;
          }
          state.runs[state.algorithm].custom = newCustomRun(pick, [
            pick.a,
            pick.b,
          ]);
          openExperience(state.algorithm, "custom", "start");
        }

        function onSummaryPrimary() {
          const alg = state.algorithm;
          if (state.experience === "custom") {
            return;
          }
          if (state.experience === "guided") {
            state.runs[alg].guided = createRun(8);
          } else {
            state.runs[alg].challenge = newChallengeRun(alg);
          }
          openExperience(alg, state.experience, "start");
        }

        function onSummarySecondary() {
          if (state.experience === "custom") {
            return;
          }
          openExperience(
            state.algorithm,
            state.experience === "guided" ? "challenge" : "guided",
            "switch",
          );
        }

        function onExperienceSwitch(experience) {
          if (state.experience === experience) {
            return;
          }
          openExperience(state.algorithm, experience, "switch");
        }

        function onEscape() {
          const rec = currentRecord();
          if (!rec || rec.pending === null) {
            return;
          }
          const id = rec.pending;
          undo(rec);
          rec.feedback = null;
          state.focusReq = { type: "tile", id };
          render();
        }

        function onKeyDown(e) {
          if (e.key === "Escape") {
            if (drag && drag.moved && !drag.cancelled) {
              cancelDrag(true);
            } else {
              onEscape();
            }
            return;
          }
          if (state.screen !== "tutorial") {
            return;
          }
          if (e.key === "ArrowRight" && !dom.introNext.disabled) {
            dom.introNext.click();
          } else if (e.key === "ArrowLeft" && !dom.introPrev.disabled) {
            dom.introPrev.click();
          }
        }

        // ==========================================================
        // Wiring
        // ==========================================================
        dom.langBtn.addEventListener("click", () => {
          state.lang = state.lang === "en" ? "pl" : "en";
          applyTranslations();
          state.focusReq = null;
          render();
        });

        dom.introPrev.addEventListener("click", () => openTutorial(1));
        dom.introNext.addEventListener("click", () => {
          if (state.tutorial.scene === 1) {
            openTutorial(2);
          } else {
            openChoice();
          }
        });
        dom.introSkip.addEventListener("click", openChoice);
        dom.introReplay.addEventListener("click", replayTutorial);
        dom.replayBtn.addEventListener("click", replayTutorial);
        dom.hintBtn.addEventListener("click", onHint);
        dom.stepBtn.addEventListener("click", onShowStep);
        dom.undoBtn.addEventListener("click", onUndo);
        dom.resetBtn.addEventListener("click", onReset);
        dom.summaryPrimary.addEventListener("click", onSummaryPrimary);
        dom.summarySecondary.addEventListener("click", onSummarySecondary);
        dom.expGuided.addEventListener("click", () =>
          onExperienceSwitch("guided"),
        );
        dom.expChallenge.addEventListener("click", () =>
          onExperienceSwitch("challenge"),
        );
        dom.expCustom.addEventListener("click", () =>
          onExperienceSwitch("custom"),
        );
        dom.switchAlgBtn.addEventListener("click", () => {
          state.screen = "choice";
          state.focusReq = { type: "introHeading" };
          render();
        });
        dom.moreBtn.addEventListener("click", () => {
          state.moreOpen = !state.moreOpen;
          render();
        });
        dom.chartToggle.addEventListener("click", () => {
          state.chartOpen = !state.chartOpen;
          state.focusReq = { type: "chartToggle" };
          render();
        });
        document.addEventListener("keydown", onKeyDown);
        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp);
        document.addEventListener("pointercancel", onPointerCancel);
        document.addEventListener("lostpointercapture", onLostCapture);
        document.addEventListener("click", swallowSyntheticClick, true);

        let resizeTimer = null;
        window.addEventListener("resize", () => {
          if (resizeTimer) {
            clearTimeout(resizeTimer);
          }
          resizeTimer = setTimeout(() => {
            layoutProof();
            layoutConnectors();
            layoutChart();
          }, 80);
        });
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => {
            layoutProof();
            layoutConnectors();
            layoutChart();
          });
        }

        // ==========================================================
        // Init
        // ==========================================================
        applyTranslations();
        ensureTutorialRecords();
        if (introSeen()) {
          state.screen = "choice";
        }
        state.focusReq = { type: "introHeading" };
        render();
      })();
    </script>
  </body>
</html>
