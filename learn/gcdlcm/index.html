        // ==========================================================
        // [rules:start]
        const PRIMES = [2, 3, 5, 7];

        const GUIDED_DECK = {
          gcd: [
            [18, 24],
            [8, 12],
            [15, 20],
            [8, 9],
            [12, 12],
            [10, 30],
            [9, 15],
            [12, 18],
          ],
          lcm: [
            [6, 8],
            [9, 12],
            [10, 15],
            [8, 9],
            [12, 12],
            [5, 20],
            [12, 18],
            [4, 6],
          ],
        };

        // ---- math helpers ----
        function primeFactors(n) {
          const out = [];
          let m = n;
          let d = 2;
          while (m > 1 && d * d <= m) {
            while (m % d === 0) {
              out.push(d);
              m = m / d;
            }
            d += 1;
          }
          if (m > 1) {
            out.push(m);
          }
          return out;
        }

        function factorCounts(factors) {
          const counts = {};
          factors.forEach((p) => {
            counts[p] = (counts[p] || 0) + 1;
          });
          return counts;
        }

        function product(list) {
          return list.reduce((acc, p) => acc * p, 1);
        }

        function gcd(a, b) {
          const ca = factorCounts(primeFactors(a));
          const cb = factorCounts(primeFactors(b));
          let out = 1;
          Object.keys(ca).forEach((p) => {
            if (cb[p]) {
              out *= Math.pow(Number(p), Math.min(ca[p], cb[p]));
            }
          });
          return out;
        }

        function lcm(a, b) {
          const ca = factorCounts(primeFactors(a));
          const cb = factorCounts(primeFactors(b));
          const keys = {};
          Object.keys(ca).forEach((p) => {
            keys[p] = true;
          });
          Object.keys(cb).forEach((p) => {
            keys[p] = true;
          });
          let out = 1;
          Object.keys(keys).forEach((p) => {
            out *= Math.pow(Number(p), Math.max(ca[p] || 0, cb[p] || 0));
          });
          return out;
        }

        // ---- Challenge generator ----
        // Every task value: 2..30 with prime factors from PRIMES only.
        const CHALLENGE_VALUES = [];
        for (let n = 2; n <= 30; n += 1) {
          if (primeFactors(n).every((p) => PRIMES.indexOf(p) >= 0)) {
            CHALLENGE_VALUES.push(n);
          }
        }

        // A drawn or picked pair must keep its proof legible at phone width:
        // max(a, b) ÷ gcd is the number of chunks in the longer GCD bar and
        // the number of jumps the shorter LCM marker makes to the meeting
        // point. Nine is the Guided decks' hardest pair (8,9); the LCM track
        // ends at 72.
        const PROOF_RATIO_MAX = 9;
        const LCM_TRACK_MAX = 72;
        function proofFits(algorithm, a, b) {
          if (Math.max(a, b) / gcd(a, b) > PROOF_RATIO_MAX) {
            return false;
          }
          return algorithm === "gcd" || lcm(a, b) <= LCM_TRACK_MAX;
        }

        // Five task shapes per algorithm in deck order: "shared" pairs have a
        // common prime, "coprime" pairs none, "equal" pairs are one composite
        // number twice. Pre-split boards open at Match; one shared task per
        // algorithm carries the story copy.
        const CHALLENGE_SLOTS = {
          gcd: [
            { shape: "shared", preSplit: false, context: false },
            { shape: "shared", preSplit: true, context: false },
            { shape: "shared", preSplit: false, context: true },
            { shape: "coprime", preSplit: true, context: false },
            { shape: "equal", preSplit: false, context: false },
          ],
          lcm: [
            { shape: "shared", preSplit: false, context: false },
            { shape: "coprime", preSplit: true, context: false },
            { shape: "shared", preSplit: false, context: true },
            { shape: "coprime", preSplit: true, context: false },
            { shape: "equal", preSplit: false, context: false },
          ],
        };

        function pairShape(a, b) {
          if (a === b) {
            return PRIMES.indexOf(a) >= 0 ? null : "equal";
          }
          return gcd(a, b) === 1 ? "coprime" : "shared";
        }

        // Every a ≤ b pair of task values with that shape that fits the proof
        // and is not one of the algorithm's Guided pairs.
        function challengePool(algorithm, shape) {
          const guided = GUIDED_DECK[algorithm].map(
            (p) => Math.min(p[0], p[1]) + "," + Math.max(p[0], p[1]),
          );
          const out = [];
          CHALLENGE_VALUES.forEach((a) => {
            CHALLENGE_VALUES.forEach((b) => {
              if (
                a <= b &&
                pairShape(a, b) === shape &&
                proofFits(algorithm, a, b) &&
                guided.indexOf(a + "," + b) < 0
              ) {
                out.push([a, b]);
              }
            });
          });
          return out;
        }

        function properDivisorsDesc(n) {
          const out = [];
          for (let d = n - 1; d >= 1; d -= 1) {
            if (n % d === 0) {
              out.push(d);
            }
          }
          return out;
        }

        // Wrong answers a real mistake reaches. Below the answer: one of its
        // divisors (a pair or a leftover missed). Above it: for GCD the answer
        // times a prime that still divides an input (an extra tile paired),
        // for LCM a × b (a pair counted twice); doubling and tripling top the
        // list up, so it always holds at least two values.
        function wrongAnswers(algorithm, a, b, answer) {
          const larger = [];
          const push = (v) => {
            if (v !== answer && larger.indexOf(v) < 0) {
              larger.push(v);
            }
          };
          if (algorithm === "gcd") {
            PRIMES.forEach((p) => {
              if (a % (answer * p) === 0 || b % (answer * p) === 0) {
                push(answer * p);
              }
            });
          } else {
            push(a * b);
          }
          push(answer * 2);
          push(answer * 3);
          const smaller = properDivisorsDesc(answer);
          if (algorithm === "gcd") {
            // A prime that divides only one input (6,9 → 2): a factor kept
            // without checking the other side.
            PRIMES.forEach((p) => {
              if (
                p < answer &&
                (a % p === 0 || b % p === 0) &&
                smaller.indexOf(p) < 0
              ) {
                smaller.push(p);
              }
            });
            smaller.sort((x, y) => y - x);
          }
          return { smaller, larger };
        }

        // Three ascending choices with exactly one correct. The variant puts
        // the two wrong ones below, above or around the answer. A composite
        // answer takes every position; an answer with fewer than two wrong
        // values below it cannot be last (1 is always first). LCM answers
        // are always composite.
        function challengeChoices(algorithm, a, b, variant) {
          const answer = algorithm === "gcd" ? gcd(a, b) : lcm(a, b);
          const wrong = wrongAnswers(algorithm, a, b, answer);
          const picks = wrong.smaller.slice(0, [2, 0, 1][variant % 3]);
          for (let i = 0; picks.length < 2; i += 1) {
            picks.push(wrong.larger[i]);
          }
          return picks.concat([answer]).sort((x, y) => x - y);
        }

        // mulberry32: a small deterministic generator, so a Challenge draw can
        // be replayed from its seed.
        function seededRandom(seed) {
          let s = seed >>> 0;
          return function () {
            s = (s + 0x6d2b79f5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // Five tasks in slot order; no pair repeats within the deck.
        function challengeDeck(algorithm, seed) {
          const next = seededRandom(seed);
          const used = [];
          return CHALLENGE_SLOTS[algorithm].map((slot) => {
            const pool = challengePool(algorithm, slot.shape);
            let i = Math.floor(next() * pool.length);
            while (used.indexOf(pool[i].join(",")) >= 0) {
              i = (i + 1) % pool.length;
            }
            const pair = pool[i];
            used.push(pair.join(","));
            return {
              pair,
              preSplit: slot.preSplit,
              choices: challengeChoices(
                algorithm,
                pair[0],
                pair[1],
                Math.floor(next() * 3),
              ),
              context: slot.context,
            };
          });
        }

        // ---- task records ----
        // A task from the run's own deck (Challenge draws and custom boards)
        // or, with no deck, from the Guided deck.
        function taskSpec(algorithm, experience, index, deck) {
          if (deck) {
            const item = deck[index];
            return {
              algorithm,
              experience,
              taskIndex: index,
              a: item.pair[0],
              b: item.pair[1],
              preSplit: item.preSplit,
              choices: item.choices,
              context: item.context,
            };
          }
          const pair = GUIDED_DECK[algorithm][index];
          return {
            algorithm,
            experience,
            taskIndex: index,
            a: pair[0],
            b: pair[1],
            preSplit: false,
            choices: null,
            context: false,
          };
        }

        // Tiles stay in the order the child made them. Sorting them would
        // move a tile the child just placed, and the line has to stay the
        // record of what they did.
        function emitTile(rec, row, p, demo) {
          rec.tiles[row].push({
            id: (row === 0 ? "A" : "B") + rec.nextTile,
            row,
            p,
            pair: null,
            added: false,
            demo: !!demo,
          });
          rec.nextTile += 1;
        }

        function makeRecord(spec) {
          const rec = {
            algorithm: spec.algorithm,
            experience: spec.experience,
            taskIndex: spec.taskIndex,
            a: spec.a,
            b: spec.b,
            preSplit: !!spec.preSplit,
            choices: spec.choices ? spec.choices.slice() : null,
            context: !!spec.context,
            quotients: [spec.a, spec.b],
            tiles: [[], []],
            pairs: [],
            nextTile: 0,
            nextPair: 0,
            pending: null,
            choice: null,
            hintTier: 0,
            assisted: false,
            failedSubmission: false,
            solved: false,
            independent: null,
            history: [],
            feedback: null,
          };
          if (rec.preSplit) {
            [0, 1].forEach((row) => {
              primeFactors(rec.quotients[row]).forEach((p) =>
                emitTile(rec, row, p, false),
              );
              rec.quotients[row] = 1;
            });
          }
          return rec;
        }

        function derivePhase(rec) {
          if (rec.solved) {
            return "result";
          }
          if (rec.quotients[0] !== 1 || rec.quotients[1] !== 1) {
            return "split";
          }
          return "assemble";
        }

        function activeRow(rec) {
          if (rec.quotients[0] !== 1) {
            return 0;
          }
          if (rec.quotients[1] !== 1) {
            return 1;
          }
          return -1;
        }

        function validPrimes(rec) {
          const row = activeRow(rec);
          if (row < 0) {
            return [];
          }
          const q = rec.quotients[row];
          return PRIMES.filter((p) => q % p === 0);
        }

        function cloneTiles(tiles) {
          return tiles.map((row) => row.map((t) => Object.assign({}, t)));
        }

        function pushHistory(rec) {
          rec.history.push({
            quotients: rec.quotients.slice(),
            tiles: cloneTiles(rec.tiles),
            pairs: rec.pairs.map((pr) => Object.assign({}, pr)),
            nextTile: rec.nextTile,
            nextPair: rec.nextPair,
          });
        }

        const NOOP = { type: "noop" };

        function applySplit(rec, p, demo) {
          const row = activeRow(rec);
          if (row < 0 || rec.solved) {
            return NOOP;
          }
          const n = rec.quotients[row];
          if (PRIMES.indexOf(p) < 0 || n % p !== 0) {
            return { type: "invalid", key: "invalidPrime", vars: { p, n } };
          }
          pushHistory(rec);
          const q = n / p;
          rec.quotients[row] = q;
          emitTile(rec, row, p, demo);
          const tileId = (row === 0 ? "A" : "B") + (rec.nextTile - 1);
          // A prime remainder needs no second decision: naming it again
          // teaches nothing, so the row closes itself. One undo reverts both
          // tiles because the snapshot was taken before either was emitted.
          if (q !== 1 && primeFactors(q).length === 1) {
            emitTile(rec, row, q, demo);
            rec.quotients[row] = 1;
          }
          return { type: "split", row, n, p, q, tileId };
        }

        function tileById(rec, id) {
          for (let row = 0; row < 2; row += 1) {
            for (let i = 0; i < rec.tiles[row].length; i += 1) {
              if (rec.tiles[row][i].id === id) {
                return rec.tiles[row][i];
              }
            }
          }
          return null;
        }

        function unpairedTiles(rec, row) {
          return rec.tiles[row].filter((t) => t.pair === null);
        }

        // Unmade pairs, lowest prime first, one entry per still-matchable prime.
        function possiblePairs(rec) {
          const out = [];
          const bFree = unpairedTiles(rec, 1);
          unpairedTiles(rec, 0).forEach((aTile) => {
            if (out.some((entry) => entry.p === aTile.p)) {
              return;
            }
            const bTile = bFree.find((t) => t.p === aTile.p);
            if (bTile) {
              out.push({ p: aTile.p, a: aTile.id, b: bTile.id });
            }
          });
          out.sort((x, y) => x.p - y.p);
          return out;
        }

        function hasPossiblePair(rec) {
          return possiblePairs(rec).length > 0;
        }

        // A tile in either row is matchable when the opposite row still holds
        // an unpaired tile with the same prime.
        function isMatchable(rec, tile) {
          if (tile.pair !== null) {
            return false;
          }
          return unpairedTiles(rec, 1 - tile.row).some((t) => t.p === tile.p);
        }

        function mateFor(rec, tile) {
          return unpairedTiles(rec, 1 - tile.row).find((t) => t.p === tile.p);
        }

        function leftoverPhase(rec) {
          return rec.algorithm === "lcm" && !hasPossiblePair(rec);
        }

        // Unpaired tiles not yet added to the LCM result, lowest prime first, A before B.
        function pendingLeftovers(rec) {
          const out = [];
          [0, 1].forEach((row) => {
            rec.tiles[row].forEach((t) => {
              if (t.pair === null && !t.added) {
                out.push(t);
              }
            });
          });
          out.sort((x, y) => x.p - y.p || x.row - y.row);
          return out;
        }

        function tileEnabled(rec, tile) {
          if (derivePhase(rec) !== "assemble" || tile.pair !== null) {
            return false;
          }
          if (hasPossiblePair(rec)) {
            if (isMatchable(rec, tile)) {
              return true;
            }
            // With a selection pending, every unpaired tile of the opposite
            // row stays tappable so a wrong prime can be explained.
            return (
              rec.pending !== null &&
              tileById(rec, rec.pending).row !== tile.row
            );
          }
          if (rec.algorithm === "lcm") {
            return !tile.added;
          }
          return false;
        }

        // Tap and drag both commit through these two transitions, so each
        // records exactly one undo snapshot. Pair records keep a = row A.
        function commitPair(rec, first, second) {
          pushHistory(rec);
          const aTile = first.row === 0 ? first : second;
          const bTile = first.row === 0 ? second : first;
          const pair = {
            id: rec.nextPair,
            a: aTile.id,
            b: bTile.id,
            p: aTile.p,
          };
          rec.nextPair += 1;
          aTile.pair = pair.id;
          bTile.pair = pair.id;
          rec.pairs.push(pair);
          rec.pending = null;
          return { type: "pair", p: pair.p };
        }

        function commitLeftover(rec, tile) {
          pushHistory(rec);
          tile.added = true;
          return { type: "leftover", p: tile.p, row: tile.row };
        }

        function selectTile(rec, id) {
          if (derivePhase(rec) !== "assemble") {
            return NOOP;
          }
          const tile = tileById(rec, id);
          if (!tile || tile.pair !== null) {
            return NOOP;
          }
          if (hasPossiblePair(rec)) {
            const first =
              rec.pending === null ? null : tileById(rec, rec.pending);
            if (first && first.row !== tile.row) {
              if (first.p !== tile.p) {
                rec.pending = null;
                return {
                  type: "invalid",
                  key: "wrongPair",
                  vars: { p: first.p },
                  tileId: id,
                };
              }
              return commitPair(rec, first, tile);
            }
            if (!isMatchable(rec, tile)) {
              return NOOP;
            }
            if (rec.pending === id) {
              rec.pending = null;
              return { type: "deselect", tileId: id };
            }
            rec.pending = id;
            return { type: "select", p: tile.p, tileId: id };
          }
          if (rec.algorithm === "lcm" && !tile.added) {
            return commitLeftover(rec, tile);
          }
          return NOOP;
        }

        // Drag drops. A cancel mutates nothing and leaves any pending tap
        // selection in place; only a committed pair clears it.
        const CANCEL = { type: "cancel" };
        function dropTile(rec, sourceId, targetId) {
          if (derivePhase(rec) !== "assemble" || !hasPossiblePair(rec)) {
            return CANCEL;
          }
          const source = tileById(rec, sourceId);
          const target = tileById(rec, targetId);
          if (
            !source ||
            !target ||
            source.pair !== null ||
            target.pair !== null ||
            source.row === target.row ||
            !isMatchable(rec, source)
          ) {
            return CANCEL;
          }
          if (source.p !== target.p) {
            return {
              type: "invalid",
              key: "wrongPair",
              vars: { p: source.p },
              tileId: sourceId,
            };
          }
          return commitPair(rec, source, target);
        }

        // A prime dropped on the active rail is the same split as a tap,
        // including the invalidPrime explanation; any other target cancels.
        function dropPrime(rec, p, row) {
          if (derivePhase(rec) !== "split" || row !== activeRow(rec)) {
            return CANCEL;
          }
          return applySplit(rec, p, false);
        }

        // A matchable tile dropped on the Shared shelf pairs with its first
        // equal unpaired counterpart, through the same commit as a tap.
        function dropOnShared(rec, sourceId) {
          if (derivePhase(rec) !== "assemble" || !hasPossiblePair(rec)) {
            return CANCEL;
          }
          const source = tileById(rec, sourceId);
          if (!source || !isMatchable(rec, source)) {
            return CANCEL;
          }
          return commitPair(rec, source, mateFor(rec, source));
        }

        // Flow strip block index: 0 Split A, 1 Split B, 2 Match, 3 Multiply, 4 Result.
        function flowStep(rec) {
          const phase = derivePhase(rec);
          if (phase === "split") {
            return activeRow(rec) === 0 ? 0 : 1;
          }
          if (phase === "assemble") {
            return hasPossiblePair(rec) ? 2 : 3;
          }
          return 4;
        }

        // ---- flowchart: nine nodes, twelve edges, the current node ----
        // Everything here derives from quotients, tiles, pairs, algorithm and
        // preSplit only, so undo restores it exactly and a pending tap
        // selection, hint tier or Challenge choice never moves the chart.
        // One path per algorithm: numbers in, steps, result. A child is
        // learning either GCD or LCM, never both at once, so the chart shows
        // only the steps that algorithm takes and never asks which one it is.
        const FLOW_NODES = [
          "splitA",
          "stopA",
          "splitB",
          "stopB",
          "match",
          "pair",
          "leftovers",
          "multiply",
        ];
        const FLOW_KIND = {
          splitA: "action",
          stopA: "decision",
          splitB: "action",
          stopB: "decision",
          match: "decision",
          pair: "action",
          leftovers: "action",
          multiply: "action",
        };
        const FLOW_EDGES = [
          { from: "splitA", to: "stopA" },
          { from: "stopA", to: "splitA", answer: "no", loop: true },
          { from: "stopA", to: "splitB", answer: "yes" },
          { from: "splitB", to: "stopB" },
          { from: "stopB", to: "splitB", answer: "no", loop: true },
          { from: "stopB", to: "match", answer: "yes" },
          { from: "match", to: "pair", answer: "yes" },
          { from: "pair", to: "match", loop: true },
          { from: "match", to: "leftovers", answer: "no", algo: "lcm" },
          { from: "leftovers", to: "multiply", algo: "lcm" },
          { from: "match", to: "multiply", answer: "no", algo: "gcd" },
        ];

        // GCD collects nothing beyond the pairs, so it has no leftover step.
        function flowNodesFor(algorithm) {
          return FLOW_NODES.filter(
            (id) => id !== "leftovers" || algorithm === "lcm",
          );
        }

        function flowEdgesFor(algorithm) {
          return FLOW_EDGES.filter((e) => !e.algo || e.algo === algorithm);
        }

        function addedCount(rec) {
          let n = 0;
          [0, 1].forEach((row) => {
            rec.tiles[row].forEach((t) => {
              if (t.pair === null && t.added) {
                n += 1;
              }
            });
          });
          return n;
        }

        function flowNode(rec) {
          const phase = derivePhase(rec);
          const given = rec.preSplit;
          const lcm = rec.algorithm === "lcm";
          const q = rec.quotients;
          const kA = rec.tiles[0].length;
          const kB = rec.tiles[1].length;
          const splitting = phase === "split";
          const inA = splitting && activeRow(rec) === 0;
          const inB = splitting && activeRow(rec) === 1;
          const pp = !splitting && hasPossiblePair(rec);
          const lo = !splitting && lcm ? pendingLeftovers(rec) : [];
          const added = addedCount(rec);
          const matchDone = !splitting && !pp;
          const complete = !splitting && isCompleteShelf(rec);
          const states = {};
          states.splitA = given
            ? "given"
            : inA
              ? "current"
              : q[0] === 1
                ? "done"
                : "upcoming";
          states.stopA = given
            ? "given"
            : inA && kA > 0
              ? "looping"
              : q[0] === 1
                ? "done"
                : "upcoming";
          states.splitB = given
            ? "given"
            : inB
              ? "current"
              : q[1] === 1
                ? "done"
                : "upcoming";
          states.stopB = given
            ? "given"
            : inB && kB > 0
              ? "looping"
              : q[1] === 1
                ? "done"
                : "upcoming";
          states.match = splitting ? "upcoming" : pp ? "looping" : "done";
          states.pair = splitting
            ? "upcoming"
            : pp
              ? "current"
              : rec.pairs.length > 0
                ? "done"
                : "skipped";
          states.leftovers = !lcm
            ? "skipped"
            : !matchDone
              ? "upcoming"
              : lo.length > 0
                ? "current"
                : added > 0
                  ? "done"
                  : "skipped";
          states.multiply =
            phase === "result"
              ? "done"
              : phase === "assemble" && complete
                ? "current"
                : "upcoming";
          let node = "multiply";
          flowNodesFor(rec.algorithm).forEach((id) => {
            if (states[id] === "current") {
              node = id;
            }
          });
          let round = null;
          let via;
          let prev;
          if (node === "splitA") {
            round = kA + 1;
            via = kA === 0 ? null : { node: "stopA", answer: "no", q: q[0] };
            prev = kA === 0 ? null : "stopA";
          } else if (node === "splitB") {
            round = kB + 1;
            via =
              kB === 0
                ? { node: "stopA", answer: "yes" }
                : { node: "stopB", answer: "no", q: q[1] };
            prev = kB === 0 ? "stopA" : "stopB";
          } else if (node === "pair") {
            round = rec.pairs.length + 1;
            via = { node: "match", answer: "yes" };
            prev = "match";
          } else if (node === "leftovers") {
            round = added + 1;
            via = { node: "match", answer: "no" };
            prev = "match";
          } else if (lcm) {
            // The leftover step hands straight over; no diamond in between.
            via = null;
            prev = "leftovers";
          } else {
            via = { node: "match", answer: "no" };
            prev = "match";
          }
          const out = flowEdgesFor(rec.algorithm).filter(
            (e) => e.from === node,
          );
          const next =
            phase === "result" || out.length === 0 ? null : out[0].to;
          return { node, step: flowStep(rec), round, via, prev, next, states };
        }

        // Each edge with `taken` (traversed at least once so far) and `entry`
        // (the one edge that leads into the current node).
        function flowEdges(rec) {
          const phase = derivePhase(rec);
          const given = rec.preSplit;
          const lcm = rec.algorithm === "lcm";
          const q = rec.quotients;
          const kA = rec.tiles[0].length;
          const kB = rec.tiles[1].length;
          const splitting = phase === "split";
          const pp = !splitting && hasPossiblePair(rec);
          const matchDone = !splitting && !pp;
          const lo = !splitting && lcm ? pendingLeftovers(rec) : [];
          const info = flowNode(rec);
          const taken = {
            "splitA>stopA": !given && kA >= 1,
            "stopA>splitA": !given && (kA >= 2 || (kA >= 1 && q[0] !== 1)),
            "stopA>splitB": !given && q[0] === 1,
            "splitB>stopB": !given && kB >= 1,
            "stopB>splitB": !given && (kB >= 2 || (kB >= 1 && q[1] !== 1)),
            "stopB>match": !given && q[1] === 1,
            "match>pair": !splitting && (rec.pairs.length > 0 || pp),
            "pair>match": rec.pairs.length >= 1,
            "match>leftovers": lcm && matchDone,
            "match>multiply": !lcm && matchDone,
            "leftovers>multiply": lcm && matchDone && lo.length === 0,
          };
          return flowEdgesFor(rec.algorithm).map((e) => {
            const key = e.from + ">" + e.to;
            return {
              from: e.from,
              to: e.to,
              answer: e.answer || null,
              loop: !!e.loop,
              taken: !!taken[key],
              // The entry edge leads into the current node; result has none.
              entry:
                phase !== "result" &&
                info.prev !== null &&
                e.from === info.prev &&
                e.to === info.node,
            };
          });
        }

        // ---- invariants ----
        // Split: the original number equals the tiles so far times what is
        // still unsplit. The trailing quotient is dropped once it reaches 1.
        function splitInvariant(rec, row) {
          const orig = row === 0 ? rec.a : rec.b;
          const factors = rec.tiles[row].map((t) => t.p);
          const quotient = rec.quotients[row];
          const terms = quotient === 1 ? factors : factors.concat([quotient]);
          return {
            orig,
            factors,
            quotient,
            terms,
            holds: product(terms) === orig,
          };
        }

        // Match: GCD, the shelf product divides both inputs in every reachable
        // state; LCM, both inputs divide the shelf product exactly when the
        // shelf is complete, so the lines read as a goal until then.
        function dropLeftover(rec, sourceId) {
          if (derivePhase(rec) !== "assemble" || !leftoverPhase(rec)) {
            return CANCEL;
          }
          const source = tileById(rec, sourceId);
          if (!source || source.pair !== null || source.added) {
            return CANCEL;
          }
          return commitLeftover(rec, source);
        }

        function shelfTiles(rec) {
          const shared = rec.pairs.map((pr) => pr.p).sort((x, y) => x - y);
          const leftovers = [];
          [0, 1].forEach((row) => {
            rec.tiles[row].forEach((t) => {
              if (t.pair === null && t.added) {
                leftovers.push(t.p);
              }
            });
          });
          leftovers.sort((x, y) => x - y);
          return { shared, leftovers };
        }

        function shelfProduct(rec) {
          const s = shelfTiles(rec);
          return product(s.shared.concat(s.leftovers));
        }

        function incompleteReason(rec) {
          const pp = possiblePairs(rec);
          if (pp.length > 0) {
            return { key: "missingPair", vars: { p: pp[0].p } };
          }
          if (rec.algorithm === "lcm") {
            const lo = pendingLeftovers(rec);
            if (lo.length > 0) {
              return { key: "missingLeftover", vars: { p: lo[0].p } };
            }
          }
          return null;
        }

        function isCompleteShelf(rec) {
          return derivePhase(rec) !== "split" && incompleteReason(rec) === null;
        }

        // The empty-shelf sentence is only true once no equal-prime pair can
        // still be made; before that it would contradict the board.
        function showNoSharedMessage(rec) {
          return (
            rec.algorithm === "gcd" &&
            derivePhase(rec) !== "split" &&
            rec.pairs.length === 0 &&
            !hasPossiblePair(rec)
          );
        }

        function checkResult(rec) {
          if (derivePhase(rec) !== "assemble") {
            return NOOP;
          }
          const reason = incompleteReason(rec);
          if (reason) {
            return { type: "incomplete", key: reason.key, vars: reason.vars };
          }
          rec.solved = true;
          rec.pending = null;
          return { type: "solved", value: shelfProduct(rec) };
        }

        function chooseAnswer(rec, value) {
          if (
            derivePhase(rec) !== "assemble" ||
            !rec.choices ||
            rec.choices.indexOf(value) < 0
          ) {
            return NOOP;
          }
          rec.choice = value;
          return { type: "choice", value };
        }

        function submitAnswer(rec) {
          if (derivePhase(rec) !== "assemble" || !rec.choices) {
            return NOOP;
          }
          if (rec.choice === null) {
            return {
              type: "invalid",
              counted: false,
              key: "chooseAnswer",
              vars: {},
            };
          }
          const reason = incompleteReason(rec);
          if (reason) {
            rec.failedSubmission = true;
            return {
              type: "incomplete",
              counted: true,
              key: reason.key,
              vars: reason.vars,
            };
          }
          if (rec.choice !== shelfProduct(rec)) {
            rec.failedSubmission = true;
            return {
              type: "wrong",
              counted: true,
              key: "wrongChoice",
              vars: {},
            };
          }
          rec.solved = true;
          rec.pending = null;
          rec.independent = !rec.assisted && !rec.failedSubmission;
          return {
            type: "solved",
            counted: true,
            value: shelfProduct(rec),
            independent: rec.independent,
          };
        }

        // ---- hints ----
        function hintTarget(rec) {
          const phase = derivePhase(rec);
          if (phase === "result") {
            return null;
          }
          if (phase === "split") {
            const row = activeRow(rec);
            const n = rec.quotients[row];
            const p = validPrimes(rec)[0];
            return { type: "split", row, n, p, q: n / p };
          }
          const pp = possiblePairs(rec);
          if (pp.length > 0) {
            if (rec.pending !== null) {
              const mate = mateFor(rec, tileById(rec, rec.pending));
              if (mate) {
                return {
                  type: "pair",
                  p: mate.p,
                  tileId: mate.id,
                  row: mate.row,
                };
              }
            }
            return { type: "pair", p: pp[0].p, tileId: pp[0].a, row: 0 };
          }
          if (rec.algorithm === "lcm") {
            const lo = pendingLeftovers(rec);
            if (lo.length > 0) {
              return {
                type: "leftover",
                p: lo[0].p,
                tileId: lo[0].id,
                row: lo[0].row,
              };
            }
          }
          return { type: "primary", empty: rec.pairs.length === 0 };
        }

        function hintMessage(rec, tier, target) {
          const rowName = (row) => (row === 0 ? rec.a : rec.b);
          if (target.type === "split") {
            return tier === 1
              ? { key: "splitHint1", vars: { n: target.n } }
              : {
                  key: "splitHint2",
                  vars: { n: target.n, p: target.p, q: target.q },
                };
          }
          if (target.type === "pair") {
            return tier === 1
              ? { key: "assembleHint1", vars: {} }
              : {
                  key: "assembleHint2",
                  vars: { p: target.p, n: rowName(target.row) },
                };
          }
          if (target.type === "leftover") {
            return tier === 1
              ? { key: "leftoverHint1", vars: {} }
              : {
                  key: "leftoverHint2",
                  vars: { p: target.p, n: rowName(target.row) },
                };
          }
          if (target.empty && rec.algorithm === "gcd") {
            return tier === 1
              ? { key: "emptyHint1", vars: {} }
              : { key: "emptyHint2", vars: {} };
          }
          return {
            key: rec.algorithm === "gcd" ? "gcdRule" : "lcmRule",
            vars: {},
          };
        }

        function pressHint(rec) {
          const target = hintTarget(rec);
          if (!target) {
            return NOOP;
          }
          rec.assisted = true;
          if (rec.hintTier < 2) {
            rec.hintTier += 1;
          } else if (rec.hintTier === 2 && target.type !== "primary") {
            rec.hintTier = 3;
          }
          const msg = hintMessage(rec, Math.min(rec.hintTier, 2), target);
          return {
            type: "hint",
            tier: rec.hintTier,
            key: msg.key,
            vars: msg.vars,
            target,
          };
        }

        function applyHintStep(rec) {
          if (rec.hintTier !== 3) {
            return NOOP;
          }
          const target = hintTarget(rec);
          if (!target || target.type === "primary") {
            rec.hintTier = 2;
            return NOOP;
          }
          let ev;
          if (target.type === "split") {
            ev = applySplit(rec, target.p, false);
          } else if (target.type === "pair") {
            if (rec.pending === null) {
              rec.pending = target.tileId;
              ev = selectTile(
                rec,
                mateFor(rec, tileById(rec, target.tileId)).id,
              );
            } else {
              ev = selectTile(rec, target.tileId);
            }
          } else {
            ev = selectTile(rec, target.tileId);
          }
          rec.hintTier = 0;
          return ev;
        }

        // ---- undo / reset ----
        function canUndo(rec) {
          return (
            !rec.solved && (rec.pending !== null || rec.history.length > 0)
          );
        }

        function undo(rec) {
          if (rec.solved) {
            return NOOP;
          }
          if (rec.pending !== null) {
            const id = rec.pending;
            rec.pending = null;
            rec.hintTier = 0;
            return { type: "deselect", tileId: id };
          }
          if (rec.history.length === 0) {
            return NOOP;
          }
          const snap = rec.history.pop();
          rec.quotients = snap.quotients;
          rec.tiles = snap.tiles;
          rec.pairs = snap.pairs;
          rec.nextTile = snap.nextTile;
          rec.nextPair = snap.nextPair;
          rec.hintTier = 0;
          return { type: "undo" };
        }

        // A fresh board for the same task. Challenge scoring flags survive so a
        // reset can never restore independent status.
        function resetRecord(rec) {
          const fresh = makeRecord(rec);
          fresh.assisted = rec.assisted;
          fresh.failedSubmission = rec.failedSubmission;
          return fresh;
        }

        // ---- runs (one per algorithm × experience, session only) ----
        function createRun(size, deck) {
          return {
            size,
            deck: deck || null,
            activeIndex: null,
            records: {},
            completed: {},
            lastIndex: null,
          };
        }

        function completedCount(run) {
          return Object.keys(run.completed).length;
        }

        // What the child has got right so far. The solved task counts at the
        // moment it is solved; finishActive still does the run bookkeeping
        // when the child moves on.
        function solvedCount(run) {
          const idx = run.activeIndex;
          const rec = idx === null ? null : run.records[idx];
          const pending = rec && rec.solved && !run.completed[idx] ? 1 : 0;
          return Object.keys(run.completed).length + pending;
        }

        function independentCount(run) {
          return Object.keys(run.completed).filter(
            (k) => run.completed[k].independent,
          ).length;
        }

        function firstUnsolved(run) {
          for (let i = 0; i < run.size; i += 1) {
            if (!run.completed[i]) {
              return i;
            }
          }
          return -1;
        }

        // Resume the parked task, else start the first unsolved task, else summary.
        function openRun(run, algorithm, experience) {
          if (run.activeIndex !== null) {
            return {
              view: "task",
              record: run.records[run.activeIndex],
              fresh: false,
            };
          }
          const idx = firstUnsolved(run);
          if (idx < 0) {
            return {
              view: "summary",
              record:
                run.lastIndex !== null ? run.records[run.lastIndex] : null,
              fresh: false,
            };
          }
          run.activeIndex = idx;
          run.records[idx] = makeRecord(
            taskSpec(algorithm, experience, idx, run.deck),
          );
          return { view: "task", record: run.records[idx], fresh: true };
        }

        function finishActive(run) {
          const idx = run.activeIndex;
          const rec = idx === null ? null : run.records[idx];
          if (!rec || !rec.solved) {
            return false;
          }
          run.completed[idx] = { independent: rec.independent === true };
          run.lastIndex = idx;
          run.activeIndex = null;
          return true;
        }

        function resetActive(run) {
          if (run.activeIndex === null) {
            return null;
          }
          run.records[run.activeIndex] = resetRecord(
            run.records[run.activeIndex],
          );
          return run.records[run.activeIndex];
        }
        // [rules:end]

        // ==========================================================
        // App state
        // ==========================================================
        const INTRO_KEY = "gcdlcmIntroSeenV2";
        const SVG_NS = "http://www.w3.org/2000/svg";

        // Challenge decks are drawn from the clock; ?debug=1&seed=N replays a
        // draw for the layout checker.
        const params = new URLSearchParams(location.search);
        const seedParam = params.get("seed") || "";
        const debugSeed =
          params.get("debug") === "1" && /^\d+$/.test(seedParam)
            ? Number(seedParam)
            : NaN;
        let seedCount = 0;
        function freshSeed() {
          seedCount += 1;
          const base = Number.isFinite(debugSeed) ? debugSeed : Date.now();
          return (base + seedCount * 7919) >>> 0;
        }
        function newChallengeRun(algorithm) {
          return createRun(5, challengeDeck(algorithm, freshSeed()));
        }
        // "Your numbers": an empty run shows the picker; a run with one
        // custom task plays it Guided-style. The picks survive the next draw.
        function newCustomRun(pick, pair) {
          const run = pair
            ? createRun(1, [
                { pair, preSplit: false, choices: null, context: false },
              ])
            : createRun(0, []);
          run.pick = pick;
          return run;
        }

        const state = {
          lang: (navigator.language || "").startsWith("pl") ? "pl" : "en",
          screen: "tutorial", // "tutorial" | "choice" | "practice"
          tutorial: {
            scene: 1,
            records: [null, null],
            childSplit: false,
            demoRunning: false,
            demoTimer: null,
          },
          algorithm: null,
          experience: "guided",
          runs: {
            gcd: {
              guided: createRun(8),
              challenge: newChallengeRun("gcd"),
              custom: newCustomRun({ a: null, b: null }, null),
            },
            lcm: {
              guided: createRun(8),
              challenge: newChallengeRun("lcm"),
              custom: newCustomRun({ a: null, b: null }, null),
            },
          },
          moreOpen: false,
          chartOpen: false, // phones: the compact card expanded to the chart
          focusReq: null,
          popTile: null,
          pendingPrime: null,
          revealProof: false,
          reduceMotion: false,

        const motionQuery = window.matchMedia
          ? window.matchMedia("(prefers-reduced-motion: reduce)")
          : null;
        if (motionQuery) {
          state.reduceMotion = motionQuery.matches;
          if (typeof motionQuery.addEventListener === "function") {
            motionQuery.addEventListener("change", (e) => {
              state.reduceMotion = e.matches;
            });

        }

        function T(key) {
          return I18N[state.lang][key] || key;
        }

        function fmt(template, vars) {
          return template.replace(/\{(\w+)\}/g, (match, name) =>
            vars && Object.prototype.hasOwnProperty.call(vars, name)
              ? String(vars[name])
              : match,
          );
        }

        function msgText(msg) {
          return fmt(T(msg.key), msg.vars);

        const $ = (id) => document.getElementById(id);
        const dom = {
          homeLink: $("homeLink"),
          titleText: $("titleText"),
          subtitleText: $("subtitleText"),
          langBtn: $("langBtn"),
          stage: $("stage"),
          stageCue: $("stageCue"),
          chart: $("chart"),
          chartList: $("chartList"),
          chartEdges: $("chartEdges"),
          chartToggle: $("chartToggle"),
          moreBtn: $("moreBtn"),
          moreBody: $("moreBody"),
          workbench: $("workbench"),
          main: $("main"),
          live: $("live"),
          introTitle: $("introTitle"),
          introLines: $("introLines"),
          iconGcd: $("iconGcd"),
          iconLcm: $("iconLcm"),
          introNav: $("introNav"),
          introPrev: $("introPrev"),
          introCounter: $("introCounter"),
          introNext: $("introNext"),
          introSkip: $("introSkip"),
          introReplay: $("introReplay"),

          undoBtn: $("undoBtn"),
          stepBtn: $("stepBtn"),

          summarySecondary: $("summarySecondary"),
          progressText: $("progressText"),
          expGuided: $("expGuided"),
          expChallenge: $("expChallenge"),
          expCustom: $("expCustom"),

          replayBtn: $("replayBtn"),
        };

        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) {
            node.className = className;
          }
          if (text !== undefined) {
            node.textContent = text;
          }
          return node;
        }

        function svgEl(tag, attrs) {
          const node = document.createElementNS(SVG_NS, tag);
          Object.keys(attrs).forEach((k) =>
            node.setAttribute(k, String(attrs[k])),
          );
          return node;

          node.setAttribute("aria-label", text);
          node.title = text;
        }

        let liveTimer = null;
        function announce(text) {
          dom.live.textContent = "";
          if (liveTimer) {
            clearTimeout(liveTimer);
          }
          liveTimer = setTimeout(() => {
            dom.live.textContent = text;
          }, 40);
        }

        // The panel keeps the sentence; this is the signal beside the
        // child's hand. Removing the class and reading a layout property
        // restarts the animation when the same control is refused twice.
        function flashWrong(node) {
          if (!node) {
            return;
          }
          node.classList.remove("is-wrong");
          if (node.offsetWidth >= 0) {
            node.classList.add("is-wrong");
          }
          window.setTimeout(() => {
            node.classList.remove("is-wrong");
          }, 700);
        }

        function algorithmName(alg) {
          return T(alg === "gcd" ? "gcdName" : "lcmName");
        }

        function joinTimes(list) {
          return list.join(" × ");
        }

        // ==========================================================
        // Derived views
        // ==========================================================
        function currentRun() {
          return state.runs[state.algorithm][state.experience];
        }

        function currentRecord() {
          if (state.screen === "tutorial") {
            return state.tutorial.records[state.tutorial.scene - 1];
          }
          if (state.screen === "practice") {
            const run = currentRun();
            return run.activeIndex === null
              ? null
              : run.records[run.activeIndex];
          }
          return null;
        }

        function practiceView() {
          const run = currentRun();
          if (run.activeIndex !== null) {
            return { view: "task", record: run.records[run.activeIndex] };
          }
          if (firstUnsolved(run) < 0) {
            return {
              view: "summary",
              record:
                run.lastIndex !== null ? run.records[run.lastIndex] : null,
            };
          }
          return { view: "task", record: null };
        }

        function taskSentence(rec) {
          let key = rec.algorithm === "gcd" ? "taskGcd" : "taskLcm";
          if (rec.context) {
            key = rec.algorithm === "gcd" ? "contextGcd" : "contextLcm";
          }
          return fmt(T(key), { a: rec.a, b: rec.b });
        }

        // The one instruction for the current step (§7 cue* keys). Empty in
        // result, where the proof and the next action speak for themselves.
        function cueSentence(rec) {
          const phase = derivePhase(rec);
          if (phase === "split") {
            return fmt(T("cueSplit"), { n: rec.quotients[activeRow(rec)] });
          }
          if (phase !== "assemble") {
            return "";
          }
          if (hasPossiblePair(rec)) {
            return T("cuePair");
          }
          if (leftoverPhase(rec) && pendingLeftovers(rec).length > 0) {
            return T("cueLeftover");
          }
          // An empty GCD shelf says "No shared tiles" on the shelf itself;
          // the cue does not say it a second time.
          return T(rec.choices ? "cueSubmit" : "cueCheck");
        }

        // Exactly one zone is lit per work phase: the active rail, the Shared
        // shelf, or the Left over shelf. Nothing during the demo or in result.
        function litZone(rec, ctx) {
          if (!ctx.interactive || derivePhase(rec) === "result") {
            return null;
          }
          if (derivePhase(rec) === "split") {
            return "rail";
          }
          if (hasPossiblePair(rec)) {
            return "shared";
          }
          return leftoverPhase(rec) && pendingLeftovers(rec).length > 0
            ? "leftovers"
            : null;
        }

        function proofSentence(rec) {
          const value = shelfProduct(rec);
          if (rec.algorithm === "gcd") {
            return fmt(T("gcdProof"), {
              a: rec.a,
              b: rec.b,
              qa: rec.a / value,
              qb: rec.b / value,
              g: value,
            });
          }
          return fmt(T("lcmProof"), {
            m: value,
            ka: value / rec.a,
            kb: value / rec.b,
            a: rec.a,
            b: rec.b,
          });
        }

        function isFirstGuided(rec) {
          return rec.experience === "guided" && rec.taskIndex === 0;
        }

        // The control that should own focus once the board is rebuilt.
        function defaultFocus(rec) {
          if (!rec) {
            return { type: "taskHeading" };
          }
          const phase = derivePhase(rec);
          if (phase === "split") {
            return { type: "prime", p: validPrimes(rec)[0] };
          }
          if (phase === "assemble") {
            const pp = possiblePairs(rec);
            if (pp.length > 0) {
              if (rec.pending !== null) {
                const mate = mateFor(rec, tileById(rec, rec.pending));
                return { type: "tile", id: mate ? mate.id : pp[0].a };
              }
              return { type: "tile", id: pp[0].a };
            }
            if (rec.algorithm === "lcm") {
              const lo = pendingLeftovers(rec);
              if (lo.length > 0) {
                return { type: "tile", id: lo[0].id };
              }
            }
            return rec.experience === "tutorial"
              ? { type: "introHeading" }
              : { type: "primary" };
          }
          return rec.experience === "tutorial"
            ? { type: "introNext" }
            : { type: "primary" };
        }

        // ==========================================================
        // Stage rendering
        // ==========================================================
        function buildTile(rec, tile, ctx) {
          const isResult = derivePhase(rec) === "result";
          const node = isResult
            ? el("span", "tile", String(tile.p))
            : el("button", "tile", String(tile.p));
          node.setAttribute("data-tile-id", tile.id);
          if (tile.pair !== null) {
            node.classList.add("paired");
          }
          if (tile.added) {
            node.classList.add("added");
          }
          if (tile.demo && ctx.demoRunning) {
            node.classList.add("demo");
          }
          if (state.popTile === tile.id) {
            node.classList.add("pop");
          }
          if (isResult) {
            return node;
          }
          node.type = "button";
          const enabled = ctx.interactive && tileEnabled(rec, tile);
          node.disabled = !enabled;
          if (enabled) {
            node.classList.add("actionable");
          }
          if (rec.pending === tile.id) {
            node.classList.add("selected");
          }
          if (
            ctx.hint &&
            ctx.hint.type !== "primary" &&
            ctx.hint.tileId === tile.id
          ) {
            node.classList.add("hint-glow");
          }
          const addMode = enabled && leftoverPhase(rec);
          let status = "tileFree";
          if (tile.pair !== null) {
            status = "tilePaired";
          } else if (tile.added) {
            status = "tileAdded";
          } else if (rec.pending === tile.id) {
            status = "tileSelected";
          }
          const label = addMode
            ? fmt(T(tile.row === 0 ? "addTileA" : "addTileB"), { p: tile.p })
            : fmt(T(tile.row === 0 ? "tileA" : "tileB"), {
                p: tile.p,
                status: T(status),
              });
          labelControl(node, label);
          node.addEventListener("click", () => onTileClick(tile.id));
          const mode = enabled ? dragMode(rec, tile) : null;
          if (mode) {
            node.classList.add("draggable");
            node.addEventListener("pointerdown", (e) =>
              onTilePointerDown(e, tile, mode),
            );
          }
          return node;
        }

        // ( 18 ) = ( 2 ) × ( 9 ) — the number as a ball, its factors as the
        // draggable circles, and whatever is still to be broken down as the
        // amber circle. A fresh row reads 18 = 18: the amber circle is on
        // screen from the start and is what a prime is dropped onto, so the
        // child always has a target. It disappears at 1. The separators are
        // real text nodes so the line reads as an equation.
        function buildSplitLine(rec, row, ctx) {
          const eq = el("div", "rail-eq");
          const inv = splitInvariant(rec, row);
          eq.appendChild(el("span", "num-ball", String(inv.orig)));
          eq.appendChild(document.createTextNode(" = "));
          rec.tiles[row].forEach((tile, i) => {
            if (i > 0) {
              eq.appendChild(document.createTextNode(" × "));
            }
            eq.appendChild(buildTile(rec, tile, ctx));
          });
          if (inv.quotient !== 1) {
            if (rec.tiles[row].length > 0) {
              eq.appendChild(document.createTextNode(" × "));
            }
            const target =
              ctx.interactive &&
              derivePhase(rec) === "split" &&
              activeRow(rec) === row;
            const quot = target
              ? el("button", "quot-circle", String(inv.quotient))
              : el("span", "quot-circle", String(inv.quotient));
            quot.setAttribute("data-row", row === 0 ? "A" : "B");
            if (target) {
              quot.type = "button";
              // Only a tab stop once a prime is waiting to land on it, so the
              // resting Tab order still runs straight to the prime buttons.
              quot.tabIndex = state.pendingPrime === null ? -1 : 0;
              labelControl(quot, fmt(T("quotTarget"), { q: inv.quotient }));
              quot.addEventListener("click", () => onQuotClick(row));
            }
            if (litZone(rec, ctx) === "rail" && activeRow(rec) === row) {
              quot.classList.add("lit");
            }
            eq.appendChild(quot);
          }
          // No tick: the split can only ever divide exactly, so a mark that
          // can never say no says nothing. A finished row reads as finished
          // because its amber circle is gone and every circle is green.
          return eq;
        }

        function buildRail(rec, row, ctx) {
          const rail = el("div", "rail");
          rail.setAttribute("data-row", row === 0 ? "A" : "B");
          rail.appendChild(buildSplitLine(rec, row, ctx));
          return rail;
        }

        function buildPrimeRow(rec, ctx) {
          const row = el("div", "prime-row");
          const n = rec.quotients[activeRow(rec)];
          const primes = ctx.primes || PRIMES;
          const cuePrime = isFirstGuided(rec) ? validPrimes(rec)[0] : null;
          primes.forEach((p) => {
            const btn = el("button", "prime-btn", String(p));
            btn.type = "button";
            btn.setAttribute("data-prime", String(p));
            btn.disabled = !ctx.interactive;
            labelControl(btn, fmt(T("primeChoice"), { n, p }));
            if (state.pendingPrime === p) {
              btn.classList.add("selected");
            }
            if (ctx.hint && ctx.hint.type === "split" && ctx.hint.p === p) {
              btn.classList.add("hint-glow");
            } else if (cuePrime === p) {
              btn.classList.add("cue");
            }
            btn.addEventListener("click", () => onPrimeClick(p));
            if (ctx.interactive) {
              btn.classList.add("draggable");
              btn.addEventListener("pointerdown", (e) =>
                onTilePointerDown(e, { id: null, row: -1, p }, "prime"),
              );
            }
            row.appendChild(btn);
          });
          return row;
        }

        function buildShelf(labelKey, values, emptyKey, lit) {
          const shelf = el("div", "shelf");
          shelf.setAttribute("data-shelf", labelKey);
          if (lit) {
            shelf.classList.add("lit");
          }
          shelf.appendChild(el("span", "shelf-label", T(labelKey)));
          const tiles = el("div", "shelf-tiles");
          if (values.length === 0 && emptyKey) {
            tiles.appendChild(el("span", "shelf-empty", T(emptyKey)));
          }
          values.forEach((p) =>
            tiles.appendChild(el("span", "shelf-tile", String(p))),
          );
          shelf.appendChild(tiles);
          return shelf;
        }

        function buildResultShelf(rec, ctx) {
          const shelf = el("div", "shelf");
          shelf.appendChild(el("span", "shelf-label", T("result")));
          const row = el("div", "result-row");
          const prod = el("div", "product");
          const s = shelfTiles(rec);
          const factors = s.shared.concat(s.leftovers);
          const solved = derivePhase(rec) === "result";
          if (factors.length > 0) {
            prod.appendChild(el("span", "", joinTimes(factors) + " = "));
          }
          if (solved) {
            prod.appendChild(el("span", "value", String(shelfProduct(rec))));
          } else {
            prod.appendChild(el("span", "unknown", "?"));
          }
          row.appendChild(prod);
          if (rec.experience !== "tutorial" && !ctx.summary) {
            const btn = el("button", "action-btn primary");
            btn.type = "button";
            btn.id = "primaryBtn";
            if (solved) {
              let key = "nextPair";
              if (rec.experience === "challenge") {
                key = "nextChallenge";
              } else if (rec.experience === "custom") {
                key = "customNext";
              }
              btn.textContent = T(key);
              btn.addEventListener("click", onNextTask);
            } else {
              btn.textContent = T(
                rec.experience === "challenge" ? "submit" : "check",
              );
              btn.disabled = derivePhase(rec) !== "assemble";
              if (ctx.hint && ctx.hint.type === "primary") {
                btn.classList.add("hint-glow");
              }
              btn.addEventListener("click", onPrimaryAction);
            }
            row.appendChild(btn);
          }
          shelf.appendChild(row);
          return shelf;
        }

        function buildChoices(rec) {
          const row = el("div", "choices");
          rec.choices.forEach((value) => {
            const btn = el("button", "choice-num", String(value));
            btn.type = "button";
            btn.setAttribute("data-choice", String(value));
            btn.setAttribute(
              "aria-pressed",
              rec.choice === value ? "true" : "false",
            );
            btn.addEventListener("click", () => onChoiceClick(value));
            row.appendChild(btn);
          });
          return row;
        }

        function buildProof(rec) {
          const proof = el("div", "proof");
          if (state.revealProof && !state.reduceMotion) {
            proof.classList.add("reveal");
          }
          const wrap = el("div", "proof-svg-wrap");
          wrap.id = "proofWrap";
          proof.appendChild(wrap);
          // The definition leads: the child has the number in front of them
          // and this says what they just found. The product itself is already
          // on the shelf above, in much larger type.
          const text = el("p", "proof-text");
          text.appendChild(
            el(
              "strong",
              "",
              T(rec.algorithm === "gcd" ? "gcdMeaning" : "lcmMeaning") + " ",
            ),
          );
          text.appendChild(document.createTextNode(proofSentence(rec)));
          proof.appendChild(text);
          return proof;
        }

        function drawGcdProof(rec, wrap) {
          const width = Math.max(280, wrap.clientWidth || 0);
          const labelW = 64;
          const trackW = width - labelW - 8;
          const g = gcd(rec.a, rec.b);
          const unit = trackW / Math.max(rec.a, rec.b);
          const svg = svgEl("svg", {
            width,
            height: 88,
            viewBox: "0 0 " + width + " 88",
            "aria-hidden": "true",
          });
          [
            { n: rec.a, cls: "a", y: 2 },
            { n: rec.b, cls: "b", y: 48 },
          ].forEach((bar) => {
            const label = svgEl("text", {
              x: 0,
              y: bar.y + 26,
              class: "proof-label " + bar.cls,
            });
            label.textContent = String(bar.n);
            svg.appendChild(label);
            const chunks = bar.n / g;
            const chunkW = g * unit;
            for (let i = 0; i < chunks; i += 1) {
              const x = labelW + i * chunkW;
              svg.appendChild(
                svgEl("rect", {
                  x: x + 1,
                  y: bar.y,
                  width: Math.max(1, chunkW - 2),
                  height: 34,
                  rx: 4,
                  class: "proof-chunk " + bar.cls,
                }),
              );
              if (chunkW >= 26) {
                const num = svgEl("text", {
                  x: x + chunkW / 2,
                  y: bar.y + 22,
                  class: "proof-num",
                });
                num.textContent = String(g);
                svg.appendChild(num);
              }
            }
          });
          wrap.textContent = "";
          wrap.appendChild(svg);
        }

        function drawLcmProof(rec, wrap) {
          const width = Math.max(280, wrap.clientWidth || 0);
          const m = lcm(rec.a, rec.b);
          const track = Math.min(2 * m, 72);
          const labelW = 40;
          const unit = (width - labelW - 24) / track;
          const x = (v) => labelW + v * unit;
          const svg = svgEl("svg", {
            width,
            height: 98,
            viewBox: "0 0 " + width + " 98",
            "aria-hidden": "true",
          });
          svg.appendChild(
            svgEl("rect", {
              x: x(m) - 2,
              y: 6,
              width: 4,
              height: 82,
              class: "proof-band",
            }),
          );
          [
            { n: rec.a, cls: "a", y: 24 },
            { n: rec.b, cls: "b", y: 70 },
          ].forEach((lane) => {
            const label = svgEl("text", {
              x: 0,
              y: lane.y + 5,
              class: "proof-label " + lane.cls,
            });
            label.textContent = String(lane.n);
            svg.appendChild(label);
            svg.appendChild(
              svgEl("line", {
                x1: x(0),
                y1: lane.y,
                x2: x(track),
                y2: lane.y,
                class: "proof-track",
              }),
            );
            const zero = svgEl("text", {
              x: x(0),
              y: lane.y + 20,
              class: "proof-num",
            });
            zero.textContent = "0";
            svg.appendChild(zero);
            for (let v = lane.n; v <= track; v += lane.n) {
              const first = v === m;
              svg.appendChild(
                svgEl("circle", {
                  cx: x(v),
                  cy: lane.y,
                  r: first ? 8 : 6,
                  class: "proof-dot " + lane.cls + (first ? " first" : ""),
                }),
              );
              const num = svgEl("text", {
                x: x(v),
                y: lane.y + 20,
                class: "proof-num" + (first ? " first" : ""),
              });
              num.textContent = String(v);
              svg.appendChild(num);
            }
          });
          wrap.textContent = "";
          wrap.appendChild(svg);
        }

        function layoutProof() {
          const rec = currentRecordForStage();
          const wrap = $("proofWrap");
          if (!rec || !wrap || derivePhase(rec) !== "result") {
            return;
          }
          if (rec.algorithm === "gcd") {
            drawGcdProof(rec, wrap);
          } else {
            drawLcmProof(rec, wrap);
          }
        }

        function layoutConnectors() {
          const svg = $("connectors");
          const rec = currentRecordForStage();
          if (!svg || !rec) {
            return;
          }
          const bench = dom.workbench.getBoundingClientRect();
          svg.setAttribute(
            "viewBox",
            "0 0 " + Math.max(1, bench.width) + " " + Math.max(1, bench.height),
          );
          svg.textContent = "";
          const rectOf = (id) => {
            const node = dom.workbench.querySelector(
              '[data-tile-id="' + id + '"]',
            );
            return node ? node.getBoundingClientRect() : null;
          };
          const draw = (aId, bId, preview) => {
            const ra = rectOf(aId);
            const rb = rectOf(bId);
            if (!ra || !rb) {
              return;
            }
            svg.appendChild(
              svgEl("line", {
                x1: ra.left + ra.width / 2 - bench.left,
                y1: ra.bottom - bench.top,
                x2: rb.left + rb.width / 2 - bench.left,
                y2: rb.top - bench.top,
                class: "pair-line" + (preview ? " preview" : ""),
              }),
            );
          };
          rec.pairs.forEach((pr) => draw(pr.a, pr.b, false));
          if (
            isFirstGuided(rec) &&
            derivePhase(rec) === "assemble" &&
            rec.pairs.length === 0
          ) {
            const pp = possiblePairs(rec);
            if (pp.length > 0) {
              draw(pp[0].a, pp[0].b, true);
            }
          }
        }

        // The custom experience with no task open shows the number picker.
        function isPickerView() {
          return (
            state.screen === "practice" &&
            state.experience === "custom" &&
            practiceView().view === "summary"
          );
        }

        function currentRecordForStage() {
          if (state.screen === "practice") {
            return isPickerView() ? null : practiceView().record;
          }
          return currentRecord();
        }

        function buildPicker() {
          const run = currentRun();
          const box = el("div", "picker");
          ["a", "b"].forEach((row) => {
            const wrap = el("div", "pick-row " + row);
            const cap = el(
              "span",
              "pick-cap",
              T(row === "a" ? "customRowA" : "customRowB"),
            );
            cap.id = "pickCap" + row.toUpperCase();
            wrap.appendChild(cap);
            const tiles = el("div", "pick-tiles");
            tiles.setAttribute("role", "group");
            tiles.setAttribute("aria-labelledby", cap.id);
            const other = run.pick[row === "a" ? "b" : "a"];
            CHALLENGE_VALUES.forEach((n) => {
              const btn = el("button", "pick-btn", String(n));
              btn.type = "button";
              btn.dataset.pick = row + n;
              btn.setAttribute(
                "aria-pressed",
                run.pick[row] === n ? "true" : "false",
              );
              btn.disabled =
                other !== null && !proofFits(state.algorithm, n, other);
              btn.addEventListener("click", () => onPickNumber(row, n));
              tiles.appendChild(btn);
            });
            wrap.appendChild(tiles);
            box.appendChild(wrap);
          });
          box.appendChild(el("p", "pick-note", T("customNote")));
          const actions = el("div", "pick-actions");
          const start = el("button", "action-btn primary", T("customStart"));
          start.type = "button";
          start.id = "pickStart";
          start.disabled = run.pick.a === null || run.pick.b === null;
          start.addEventListener("click", onPickStart);
          actions.appendChild(start);
          box.appendChild(actions);
          return box;
        }

        function buildStageCards() {
          const cards = el("div", "stage-cards");
          [
            { alg: "gcd", id: "chooseGcd", icon: dom.iconGcd },
            { alg: "lcm", id: "chooseLcm", icon: dom.iconLcm },
          ].forEach((item) => {
            const gcd = item.alg === "gcd";
            const card = el("button", "stage-card");
            card.type = "button";
            card.id = item.id;
            card.setAttribute("aria-describedby", item.id + "Desc");
            card.appendChild(item.icon.cloneNode(true));
            card.lastChild.removeAttribute("id");
            card.appendChild(
              el("span", "stage-card-title", T(gcd ? "learnGcd" : "learnLcm")),
            );
            const body = el("span", "stage-card-body");
            body.id = item.id + "Desc";
            body.appendChild(
              el("span", "stage-card-term", algorithmName(item.alg)),
            );
            body.appendChild(
              el(
                "span",
                "stage-card-text",
                T(gcd ? "gcdMeaning" : "lcmMeaning"),
              ),
            );
            body.appendChild(
              el("span", "stage-card-text", T(gcd ? "gcdRule" : "lcmRule")),
            );
            card.appendChild(body);
            card.addEventListener("click", () =>
              openExperience(item.alg, "guided", "start"),
            );
            cards.appendChild(card);
          });
          return cards;
        }

        const NODE_LABEL_KEYS = {
          splitA: "stepSplitA",
          stopA: "nodeStop",
          splitB: "stepSplitB",
          stopB: "nodeStop",
          match: "nodeMatch",
          pair: "nodePair",
          leftovers: "nodeLeftovers",
          multiply: "nodeMultiply",
        };

        // Diamonds show the answer the board gives; the output node shows
        // the value once the board is solved.
        function nodeSecondLine(rec, id, st) {
          if (st === "given") {
            return T("nodeGiven");
          }
          if (FLOW_KIND[id] === "decision") {
            if (st === "looping") {
              return id === "match"
                ? T("yes")
                : fmt(T("nodeStopNo"), {
                    q: rec.quotients[id === "stopA" ? 0 : 1],
                  });
            }
            if (st === "done") {
              return T(id === "match" ? "no" : "yes");
            }
            return "";
          }
          if (id === "multiply" && st === "done") {
            const sh = shelfTiles(rec);
            const factors = sh.shared.concat(sh.leftovers);
            const value = shelfProduct(rec);
            return factors.length > 0
              ? joinTimes(factors) + " = " + value
              : String(value);
          }
          return "";
        }

        // Nodes are list items, not Tab stops; the board's controls remain
        // the next Tab after the heading.
        function renderChart(rec) {
          const info = flowNode(rec);
          dom.chart.hidden = false;
          dom.chart.classList.toggle("open", state.chartOpen);
          dom.chartToggle.hidden = false;
          dom.chartToggle.setAttribute(
            "aria-expanded",
            state.chartOpen ? "true" : "false",
          );
          dom.chartToggle.textContent = T(
            state.chartOpen ? "hideChart" : "showChart",
          );
          dom.stage.classList.remove("no-chart");
          dom.chartList.textContent = "";
          flowNodesFor(rec.algorithm).forEach((id) => {
            const st = info.states[id];
            const kind = FLOW_KIND[id];
            const item = el("li", "node " + kind + " " + st);
            item.setAttribute("data-node", id);
            if (st === "current") {
              item.setAttribute("aria-current", "step");
            }
            // The compact card shows the node to act on (the output node
            // once solved) with its previous and next stubs, in chart order.
            if (id === info.node) {
              item.classList.add("is-focus");
            } else if (id === info.prev) {
              item.classList.add("stub-prev");
            } else if (id === info.next) {
              item.classList.add("stub-next");
            }
            let box = item;
            if (kind === "decision") {
              const outer = el("div", "hex-outer");
              box = el("div", "hex-inner");
              outer.appendChild(box);
              item.appendChild(outer);
            }
            // The split nodes name their own number and take its colour, so
            // the chart points at the ball it acts on. The spoken name keeps
            // the row letter, which is the non-colour cue.
            const spoken = T(NODE_LABEL_KEYS[id]);
            let label = spoken;
            if (id === "splitA" || id === "splitB") {
              item.classList.add(id === "splitA" ? "row-a" : "row-b");
              label = fmt(T("nodeSplitNum"), {
                n: id === "splitA" ? rec.a : rec.b,
              });
              item.setAttribute(
                "aria-label",
                st === "done" ? "✓ " + spoken : spoken,
              );
            }
            box.appendChild(
              el(
                "span",
                "node-label",
                kind === "action" && st === "done" ? "✓ " + label : label,
              ),
            );
            const second = nodeSecondLine(rec, id, st);
            if (second !== "") {
              box.appendChild(
                el(
                  "span",
                  kind === "decision" ? "node-answer" : "node-meta",
                  second,
                ),
              );
            }
            dom.chartList.appendChild(item);
          });
          // Glyphs between the card's nodes: ↓ for the edge down to the next
          // visible node, ↺ under the last one when it loops back up to the
          // node above it and that loop is the edge being taken or taken next.
          const shown = Array.from(
            dom.chartList.querySelectorAll(".is-focus, .stub-prev, .stub-next"),
          );
          shown.forEach((item, i) => {
            if (i < shown.length - 1) {
              item.classList.add("glyph-down");
              return;
            }
            if (i === 0) {
              return;
            }
            const from = item.getAttribute("data-node");
            const to = shown[i - 1].getAttribute("data-node");
            const loops = FLOW_EDGES.some(
              (e) =>
                e.loop &&
                e.from === from &&
                e.to === to &&
                (from === info.prev || from === info.node),
            );
            if (loops) {
              item.classList.add("glyph-loop");
            }
          });
        }

        // One live-region sentence per committed action: the diamonds the
        // board just answered and the node the child is now on, e.g.
        // "All primes now? No: 3 left. Split A."
        function diamondAnswer(rec, info, id) {
          if (id === "match") {
            return info.states.match === "looping" ? "yes" : "no";
          }
          return rec.quotients[id === "stopA" ? 0 : 1] === 1 ? "yes" : "no";
        }

        function answerText(rec, id, answer) {
          if (answer === "no" && id !== "match") {
            return fmt(T("nodeStopNo"), {
              q: rec.quotients[id === "stopA" ? 0 : 1],
            });
          }
          return T(answer);
        }

        function flowSentence(rec, start) {
          const info = flowNode(rec);
          if (start === info.node && FLOW_KIND[start] === "action") {
            // Still on the same node without a diamond in between (more
            // leftovers to add).
            if (start === "leftovers") {
              return T(NODE_LABEL_KEYS[start]) + ".";
            }
          }
          const parts = [];
          const edges = flowEdgesFor(rec.algorithm);
          let node = edges.filter((e) => e.from === start)[0].to;
          while (FLOW_KIND[node] === "decision") {
            const answer = diamondAnswer(rec, info, node);
            parts.push(
              T(NODE_LABEL_KEYS[node]) +
                " " +
                answerText(rec, node, answer) +
                ".",
            );
            node = edges.filter(
              (e) => e.from === node && e.answer === answer,
            )[0].to;
          }
          parts.push(T(NODE_LABEL_KEYS[node]) + ".");
          return parts.join(" ");
        }

        function splitAnnouncement(rec, ev) {
          let text = ev.n + " ÷ " + ev.p + " = " + ev.q + ". ";
          // The row closed itself on a prime remainder, so report that
          // division too rather than letting the chart claim 1 is left.
          if (ev.q !== 1 && rec.quotients[ev.row] === 1) {
            text += ev.q + " ÷ " + ev.q + " = 1. ";
          }
